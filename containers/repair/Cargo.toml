[package]
name = "nntune-repair-server"
version = "0.1.0"
edition = "2021"
description = "Native par2 repair HTTP server for the repair Container image (batch-only, no credentials)"
license = "MIT"

[dependencies]
nntune-core = { version = "0.1.0", path = "../../crates/nntune-core", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"
