[workspace]
members = ["crates/nntune-core", "crates/nntune-subsonic"]
# workers/api, workers/ingest and workers/mb are standalone crates
# (no [workspace] table): exclude them so this parent workspace never swallows
# them after merges from main. Revisit if the scaffold card unifies the workspace.
exclude = ["workers/api", "workers/ingest", "workers/mb"]
resolver = "2"
