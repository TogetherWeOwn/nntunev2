listen_addresses = '*'
port = 5432
unix_socket_permissions = 0700
hba_file = '/trial/config/pg_hba.conf'
ssl = on
ssl_min_protocol_version = 'TLSv1.3'
ssl_cert_file = '/trial/tls/server.crt'
ssl_key_file = '/trial/tls/server.key'
password_encryption = 'scram-sha-256'
shared_preload_libraries = ''
max_connections = 40
shared_buffers = '256MB'
