# NNTune web frontend (SvelteKit via adapter-cloudflare). Build first with
# `pnpm --dir apps/web build`, then `wrangler deploy --env <staging|production>`
# (see .github/workflows/deploy.yml). `main`/`assets` paths are the
# adapter-cloudflare output layout (svelte.dev/docs/kit/adapter-cloudflare).
# No secrets here: the web frontend needs no bindings yet.
name = "nntune-web"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_als"]

[assets]
binding = "ASSETS"
directory = ".svelte-kit/cloudflare"

# Required for `wrangler preview` (per-PR preview job in deploy.yml).
# Empty block is intentional: assets/compat stay top-level.
[previews]

[env.staging]
name = "nntune-web-staging"
# Staging catch-all: the api Worker owns the more specific
# `staging.nntune.com/v1/*` and `staging.nntune.com/api/test-codes`
# routes (generated into its staging config by the `staging-api` lane in
# `.github/workflows/deploy.yml`), and the most specific route wins, so
# those paths reach the api Worker while every other path — including
# this Worker's own /api/* surfaces — stays here. Same host by design:
# the session cookie is SameSite=Lax, so the frontend and the API must
# be same-site over HTTPS. Hostname pinned against config/staging.json
# by e2e/tests/workflows.spec.ts (single source of truth).
[[env.staging.routes]]
pattern = "staging.nntune.com/*"
zone_name = "nntune.com"

[env.production]
name = "nntune-web"
