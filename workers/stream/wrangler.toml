# NNTune v2 `stream` Worker + per-user NNTP pool Durable Object.
#
# Deploy contract (provisioned by the DevOps card; no secrets here):
# - One Durable Object instance per user (`NntpPool`, id = user id) owns the
#   `nntune-stream` pool state machine (leases, lanes, quarantine). Its
#   `POST /probe` route answers ingest segment probes (src/probe.rs); the
#   ingest Worker reaches it through a cross-script Durable Object binding,
#   so deploy this Worker first.
# - The Worker's public fetch serves `GET /play/{track_id}` (src/play_route.rs):
#   it authorizes each play against a signed `v2` grant from the `api` Worker
#   (`Authorization: Bearer`, verified before any source is touched) and serves
#   `200`/`206` ranges from R2 cache hits; the wasm NNTP miss adapter is a
#   follow-up (misses answer `502 upstream_unavailable` until then).
# - Grant verification needs the `PLAY_GRANT_SECRET` secret (the `api` Worker
#   signs with the same value): provision it per environment with
#   `wrangler secret put PLAY_GRANT_SECRET`. It is never in this file.
# - Delivered-byte intervals per range response go to the per-user pool's
#   `POST /delivered` route (src/delivered.rs); interval accounting and the
#   ledger flush belong to the enforcement and meter card. Metering sinks
#   to the `meter` Analytics Engine dataset; the usage ledger itself lives in PlanetScale Postgres via
#   Hyperdrive (api card owns it — this Worker binds no database, by design).

name = "nntune-stream"
main = "build/worker/shim.mjs"
compatibility_date = "2026-10-01"

[build]
command = "cargo install -q worker-build --locked && worker-build --release"

[[durable_objects.bindings]]
name = "NNTP_POOL"
class_name = "NntpPool"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["NntpPool"]

# Top-level target is the default `wrangler deploy` (production). Named
# environments below must restate their own bindings (Cloudflare does not
# inherit them); production keeps the top-level worker name so the ingest
# cross-script `script_name = "nntune-stream"` contract resolves.
[[r2_buckets]]
binding = "AUDIO_CACHE"
bucket_name = "nntunev2-audio-prod"

[[analytics_engine_datasets]]
binding = "METER"
dataset = "nntune_meter"

[env.staging]
name = "nntune-stream-staging"
[[env.staging.durable_objects.bindings]]
name = "NNTP_POOL"
class_name = "NntpPool"
[[env.staging.r2_buckets]]
binding = "AUDIO_CACHE"
bucket_name = "nntunev2-audio-staging"
[[env.staging.analytics_engine_datasets]]
binding = "METER"
dataset = "nntune_meter"

[env.production]
name = "nntune-stream"
[[env.production.durable_objects.bindings]]
name = "NNTP_POOL"
class_name = "NntpPool"
[[env.production.r2_buckets]]
binding = "AUDIO_CACHE"
bucket_name = "nntunev2-audio-prod"
[[env.production.analytics_engine_datasets]]
binding = "METER"
dataset = "nntune_meter"

# No Hyperdrive/DB binding here, deliberately: plan and subscription
# decisions stay at grant issuance in the `api` Worker, and everything the
# play route needs beyond the grant lives in R2 (track manifests, cached
# blobs). Do not add a database binding to this Worker.
