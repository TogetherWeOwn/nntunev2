[package]
name = "nntune-stream"
version = "0.1.0"
edition = "2021"
description = "NNTune v2 stream worker: per-user NNTP pool + Range streaming play path (portable Rust core of the Cloudflare Worker / Durable Object)"
license = "MIT"

[lib]
name = "nntune_stream"
path = "src/lib.rs"
# cdylib for the Worker (wasm32); rlib so tests/ integration targets link it.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pool probe (src/probe.rs): STAT over the shared transport-generic NNTP
# client; the JSON envelope is the ingest crate's probe contract.
nntune-core = { version = "0.1.0", path = "../../crates/nntune-core", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Worker + NntpPool Durable Object entry (src/runtime.rs), wasm32 only: native
# builds and `cargo test` stay free of the Workers runtime.
[target.'cfg(target_arch = "wasm32")'.dependencies]
nntune-core = { version = "0.1.0", path = "../../crates/nntune-core", default-features = false, features = ["worker-transport"] }
worker = "0.8"
# `#[durable_object]` expands to `#[wasm_bindgen]` items resolved by name.
wasm-bindgen = "0.2.129"
futures-util = "0.3"

[dev-dependencies]
nntune-core = { version = "0.1.0", path = "../../crates/nntune-core", features = ["native-tls"] }
# Agreement pin only: lets the BUILD_SHA_UNKNOWN acceptance test import both
# crates without touching the runtime dependency set above.
nntune-logging = { version = "0.1.0", path = "../../crates/nntune-logging" }
nntune-test-nntp = { version = "0.1.0", path = "../../crates/nntune-test-nntp" }
tokio = { version = "1", features = ["macros", "rt", "time"] }
quote = "1"
syn = { version = "3", features = ["full"] }
