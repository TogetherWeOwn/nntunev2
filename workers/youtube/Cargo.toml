[package]
name = "nntune-youtube"
version = "0.1.0"
edition = "2021"
description = "NNTune v2 YouTube backend spike: portable yt-dlp-style extraction core for the Cloudflare Worker (Day 1: VISIONOS client, GO/NO-GO gate)"
license = "MIT"

[lib]
name = "nntune_youtube"
path = "src/lib.rs"
# cdylib for the Worker (wasm32); rlib so unit tests link it. The wasm32
# runtime entry (fetch handler, Durable Object, proxy client) lands with
# the deploy-config slice; until then this crate is a portable core.
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
