[package]
name = "nntune-ingest"
version = "0.1.0"
edition = "2021"
description = "NNTune v2 ingest pipeline worker (Cloudflare Worker, Rust workers-rs): BYO indexer search, NZB upload, verify, MB match"
license = "MIT"

[lib]
# cdylib for the worker; rlib so tests/ integration targets can link the crate.
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = { version = "0.8", features = ["http", "queue", "tokio-postgres"] }
http = "1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
sha2 = "0.11"
hex = "0.4"
# Structured log emitter + trace-ID propagation (docs/logging-standard.md).
nntune-logging = { path = "../../crates/nntune-logging" }
crc32fast = "1"
nntune-core = { version = "0.1.0", path = "../../crates/nntune-core", default-features = false }
# Hyperdrive Postgres client for the metered-admission ledger (same pattern
# as workers/mb): `connect_raw` over the Worker socket with the generated
# connection string.
tokio-postgres = { version = "0.7", default-features = false, features = ["js"] }
wasm-bindgen-futures = "0.4"

[dev-dependencies]
md5 = "0.8"
crc32fast = "1"
hex = "0.4"
nntune-core = { version = "0.1.0", path = "../../crates/nntune-core", default-features = false, features = ["native-tls"] }
nntune-test-nntp = { version = "0.1.0", path = "../../crates/nntune-test-nntp" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
