[package]
name = "nntune-ingest"
version = "0.1.0"
edition = "2021"
description = "NNTune v2 ingest pipeline worker (Cloudflare Worker, Rust workers-rs): BYO indexer search, NZB upload, verify, MB match"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.3", features = ["http"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
