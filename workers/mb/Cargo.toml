[package]
name = "nntune-mb"
version = "0.1.0"
edition = "2021"
description = "NNTune v2 MusicBrainz mirror read API (Cloudflare Worker, Rust workers-rs)"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.3", features = ["http"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
