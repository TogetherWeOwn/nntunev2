[package]
name = "nntune-api"
version = "0.1.0"
edition = "2021"
description = "NNTune v2 accounts/auth (passkey challenges + email magic link), sessions, BYOP credential vault (Cloudflare Worker, Rust; native + wasm32)"
license = "MIT"

[lib]
name = "nntune_api"
crate-type = ["cdylib", "rlib"]

[dependencies]
aes-gcm = { version = "0.10", features = ["aes"] }
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
# wasm32-unknown-unknown has no OS RNG: the `js` feature routes getrandom
# through Web Crypto on wasm targets (native builds unaffected). Without
# this the Worker deploy target does not build.
getrandom = { version = "0.2", features = ["js"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", features = ["derive"] }
url = "2"
subtle = "2"
# WebAuthn signature verification (pure-Rust, wasm32-compatible):
# ES256 (COSE alg -7) and EdDSA (COSE alg -8) credential public keys.
p256 = { version = "0.13", default-features = false, features = ["alloc", "arithmetic", "ecdsa"] }
ed25519-dalek = { version = "2", default-features = false, features = ["alloc"] }
# Worker HTTP + Hyperdrive entry (same versions as workers/mb). These
# compile natively so `cargo test` keeps covering the core handlers;
# the runtime-only paths live in `worker_entry`.
worker = { version = "0.3", features = ["http", "tokio-postgres"] }
tokio-postgres = { version = "0.7", default-features = false, features = ["js"] }
wasm-bindgen-futures = "0.4"

[dev-dependencies]
serde_json = "1"
