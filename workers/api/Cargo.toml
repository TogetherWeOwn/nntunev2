[package]
name = "nntune-api"
version = "0.1.0"
edition = "2021"
description = "NNTune v2 API worker: Subsonic-compatible surface, accounts/auth, sessions and BYOP credential vault (native + wasm32)"
license = "MIT"

[lib]
name = "nntune_api"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Keys and nonces use getrandom below, not aead's optional OsRng backend.
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
# Shared unpadded-base64url over this crate (F-HARD-01): one audited
# implementation for vault/auth/session. Pure Rust, wasm32-compatible.
base64 = "0.23"
hmac = "0.13"
# hmac 0.13 uses digest 0.11: sha2 must be 0.11 (same digest) or the
# Hmac<Sha256> trait bounds fail with two digest versions in the graph.
sha2 = "0.11"
# wasm32-unknown-unknown has no OS RNG: the `wasm_js` feature routes
# getrandom through Web Crypto (native builds keep the OS backend).
getrandom = { version = "0.4", features = ["wasm_js"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Structured log emitter + trace-ID propagation (docs/logging-standard.md).
# The api Worker's HTTP entry (fetch boundary) lands in a follow-up slice;
# this exposes the emitter the entry will use.
nntune-logging = { version = "0.1.0", path = "../../crates/nntune-logging" }
# Transport-free protocol types and token checksum, also exercised natively.
nntune-subsonic = { version = "0.1.0", path = "../../crates/nntune-subsonic" }
# Shared SSRF address guard + test vectors (single owner with the ingest
# fetch guards; never fork the predicate).
nntune-ssrf-guard = { version = "0.1.0", path = "../../crates/nntune-ssrf-guard" }
# Shared NZB parser for admin ingest validation (default-features off:
# no TLS transport in this worker's graph; same shape as
# workers/ingest).
nntune-core = { version = "0.1.0", path = "../../crates/nntune-core", default-features = false }
nntune-ingest = { version = "0.1.0", path = "../ingest", default-features = false, features = ["upload-caller"], optional = true }
zeroize = { version = "1", features = ["derive"] }
url = "2"
subtle = "2"
# WebAuthn signature verification (pure-Rust, wasm32-compatible):
# ES256 (COSE alg -7) and EdDSA (COSE alg -8) credential public keys.
p256 = { version = "0.14", default-features = false, features = ["alloc", "arithmetic", "ecdsa"] }
ed25519-dalek = { version = "3", default-features = false, features = ["alloc"] }
# Worker HTTP + Hyperdrive entry (same versions as workers/mb). These
# compile natively so `cargo test` keeps covering the core handlers;
# the runtime-only paths live in `worker_entry`.
worker = { version = "0.9", features = ["http", "tokio-postgres"] }
tokio-postgres = { version = "0.7", default-features = false, features = ["js"] }
wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2"
# Only for the capped request-body stream read in the Worker entry.
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# Handler deadlines also run under native synthetic executors without Tokio.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
futures-timer = "3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-util = "0.3"
tokio = { version = "1", features = ["io-util"] }
worker = "0.9"

[features]
encrypted-upload-caller = ["dep:nntune-ingest"]
staging-fixture-cleanup = ["encrypted-upload-caller"]
postgres-tests = []
# Exposes the inert adapter only to the synthetic WASM runtime test.
staging-body-wasm-test = []
# Exercise committed private catalogue playback in the synthetic Node fixture.
catalogue-playback-wasm-test = ["staging-body-wasm-test"]
# Only for a separately bundled test Worker; never enabled in releases.
billing-owned-wasm-test = []
ledger-wasm-test = ["nntune-subsonic/ledger-wasm-test"]
# Test-only real-workerd entry for Worker 0.9 span identity; replaces `main`
# in that build only (`.github/scripts/worker_span_runtime.py`). No lock change.
span-runtime-test = []

[[test]]
name = "session_refresh_postgres"
required-features = ["postgres-tests"]

[[test]]
name = "catalogue_store_postgres"
required-features = ["postgres-tests"]

[[test]]
name = "meter_meta_store_postgres"
required-features = ["postgres-tests"]

[[test]]
name = "credential_session_postgres"
required-features = ["postgres-tests"]

[[test]]
name = "subsonic_deadlock_postgres"
required-features = ["postgres-tests"]

[[test]]
name = "ingest_manifest_postgres"
required-features = ["postgres-tests"]

[[test]]
name = "ingest_classifications_postgres"
required-features = ["postgres-tests"]

[dev-dependencies]
# Cross-seam persisted source conformance uses the real pure producer.
nntune-ingest = { version = "0.1.0", path = "../ingest", default-features = false }
rusqlite = { version = "0.42", features = ["bundled"] }
serde_json = "1"
# Test-only RNG for the KEK rotation acceptance fixtures (native tests only;
# the crate itself uses getrandom, so this never ships to wasm32).
rand = "0.10"

# Native disposable-Postgres acceptance tests only (registration/enrollment
# transaction tests and the session refresh-retry suite). Never enable Tokio's
# socket runtime in the Worker production dependency graph.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# Exercise the unmounted playback consumer in the hosted upload fixture.
nntune-stream = { version = "0.1.0", path = "../stream" }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net", "time"] }
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }

# Standalone crate (also excluded in the parent workspace manifest): declaring
# itself a workspace root keeps the upward workspace walk from escaping into
# whatever checkout happens to contain this directory (cargo's own suggested
# fix). No behavior change at a repo-root checkout.
[workspace]
