[package]
name = "nntune-api"
version = "0.1.0"
edition = "2021"
description = "NNTune v2 accounts/auth (passkey challenges + email magic link), sessions, BYOP credential vault (Cloudflare Worker, Rust; native + wasm32)"
license = "MIT"

[lib]
name = "nntune_api"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Keys and nonces use getrandom below, not aead's optional OsRng backend.
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
# Shared unpadded-base64url over this crate (F-HARD-01): one audited
# implementation for vault/auth/session. Pure Rust, wasm32-compatible.
base64 = "0.23"
hmac = "0.13"
# hmac 0.13 uses digest 0.11: sha2 must be 0.11 (same digest) or the
# Hmac<Sha256> trait bounds fail with two digest versions in the graph.
sha2 = "0.11"
# wasm32-unknown-unknown has no OS RNG: the `wasm_js` feature routes
# getrandom through Web Crypto (native builds keep the OS backend).
getrandom = { version = "0.4", features = ["wasm_js"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Structured log emitter + trace-ID propagation (docs/logging-standard.md).
# The api Worker's HTTP entry (fetch boundary) lands in a follow-up slice;
# this exposes the emitter the entry will use.
nntune-logging = { version = "0.1.0", path = "../../crates/nntune-logging" }
# Shared SSRF address guard + test vectors (single owner with the ingest
# fetch guards; never fork the predicate).
nntune-ssrf-guard = { version = "0.1.0", path = "../../crates/nntune-ssrf-guard" }
zeroize = { version = "1", features = ["derive"] }
url = "2"
subtle = "2"
# WebAuthn signature verification (pure-Rust, wasm32-compatible):
# ES256 (COSE alg -7) and EdDSA (COSE alg -8) credential public keys.
p256 = { version = "0.14", default-features = false, features = ["alloc", "arithmetic", "ecdsa"] }
ed25519-dalek = { version = "3", default-features = false, features = ["alloc"] }
# Worker HTTP + Hyperdrive entry (same versions as workers/mb). These
# compile natively so `cargo test` keeps covering the core handlers;
# the runtime-only paths live in `worker_entry`.
worker = { version = "0.8", features = ["http", "tokio-postgres"] }
tokio-postgres = { version = "0.7", default-features = false, features = ["js"] }
wasm-bindgen-futures = "0.4"
# Only for the capped request-body stream read in the Worker entry.
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# Handler deadlines also run under native synthetic executors without Tokio.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
futures-timer = "3"

[dev-dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
# Test-only RNG for the KEK rotation acceptance fixtures (native tests only;
# the crate itself uses getrandom, so this never ships to wasm32).
rand = "0.8"
