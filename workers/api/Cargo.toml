[package]
name = "nntune-api"
version = "0.1.0"
edition = "2021"
description = "NNTune v2 accounts/auth (passkey challenges + email magic link), sessions, BYOP credential vault (Cloudflare Worker, Rust; native + wasm32)"
license = "MIT"

[lib]
name = "nntune_api"
crate-type = ["cdylib", "rlib"]

[dependencies]
aes-gcm = { version = "0.10", features = ["aes"] }
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", features = ["derive"] }
url = "2"
subtle = "2"

[dev-dependencies]
serde_json = "1"
