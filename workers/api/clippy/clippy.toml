# Applied by the wasm32 API check. Typed query/execute methods use unnamed
# extended-protocol statements with explicit parameter types.
disallowed-methods = [
    "tokio_postgres::Client::prepare",
    "tokio_postgres::Client::prepare_typed",
    "tokio_postgres::Client::query",
    "tokio_postgres::Client::query_raw",
    "tokio_postgres::Client::query_one",
    "tokio_postgres::Client::query_opt",
    "tokio_postgres::Client::query_scalar",
    "tokio_postgres::Client::query_one_scalar",
    "tokio_postgres::Client::query_opt_scalar",
    "tokio_postgres::Client::execute",
    "tokio_postgres::Client::execute_raw",
    "tokio_postgres::Client::copy_in",
    "tokio_postgres::Client::copy_out",
    "tokio_postgres::Transaction::prepare",
    "tokio_postgres::Transaction::prepare_typed",
    "tokio_postgres::Transaction::query",
    "tokio_postgres::Transaction::query_raw",
    "tokio_postgres::Transaction::query_one",
    "tokio_postgres::Transaction::query_opt",
    "tokio_postgres::Transaction::execute",
    "tokio_postgres::Transaction::execute_raw",
    "tokio_postgres::Transaction::bind",
    "tokio_postgres::Transaction::bind_raw",
    "tokio_postgres::Transaction::query_portal",
    "tokio_postgres::Transaction::query_portal_raw",
    "tokio_postgres::Transaction::copy_in",
    "tokio_postgres::Transaction::copy_out",
    "tokio_postgres::GenericClient::prepare",
    "tokio_postgres::GenericClient::prepare_typed",
    "tokio_postgres::GenericClient::query",
    "tokio_postgres::GenericClient::query_raw",
    "tokio_postgres::GenericClient::query_one",
    "tokio_postgres::GenericClient::query_opt",
    "tokio_postgres::GenericClient::execute",
    "tokio_postgres::GenericClient::execute_raw",
]
