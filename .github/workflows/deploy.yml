name: deploy

# Staging deploys (apps/web only).
#
# - Push to `main` deploys apps/web to its `staging` env, then the
#   `post-deploy-e2e` job calls e2e-staging.yml in the same run/revision.
#   That call is the only path to the full-journey staging E2E: it
#   `needs` `staging-web` and `staging-api` with no always()/!cancelled(),
#   so a skipped or failed deploy cannot produce a full-journey PASS, and
#   the journey never runs against the previous api while the new one is
#   still deploying.
# - Both deploy jobs bind the `staging` GitHub Environment (name + url
#   below), so push-to-main deployment records land only in `staging`.
#   The environment carries no protection rules or secrets: approval and
#   credentials stay repo-level (the `gate` job + repo secrets/vars), and
#   a skipped lane (gate disabled, staging unconfigured) still skips
#   without approval. Production records land only in `production` via
#   deploy-production.yml; no other environment exists on this repo.
# - Push deploys need the repo Actions secrets CLOUDFLARE_API_TOKEN and
#   CLOUDFLARE_ACCOUNT_ID (names only; the full account ID stays private).
#   When the token is absent, the jobs skip via the `gate` job below
#   (secrets cannot appear in a job-level `if`, so the gate maps the
#   token to an output) — CI stays green without deploying. Production
#   deploys are intentionally not wired here (a later gated lane adds
#   the promotion step; the staging evidence from this workflow covers
#   web plus the api/mb/ingest lanes, see docs/ops.md).
# Backend Worker staging lanes (api, mb, ingest; stream/repair/transcode
#   each add their own job as follow-ups). The `staging-api` job below deploys the
#   api Worker to its `staging` env on push to `main` and passes the public
#   `BUILD_SHA` var (`--var BUILD_SHA:${{ github.sha }}`, never a secret),
#   so worker log records carry the 40-hex deploy SHA in `fields.build_sha`
#   instead of `"unknown"` (`workers/api/src/worker_entry.rs`). The staging
#   wrangler config is generated in the job from public repo variables and
#   is never committed; secrets live only in Cloudflare (Worker secrets set
#   with `wrangler secret put`) and CI secrets. Before deploying, the job
#   calls `workers/api/check_hyperdrive_cache.sh --config-id
#   $HYPERDRIVE_ID_STAGING` (the HYPERDRIVE_ID_* names are non-credential
#   Actions variables, not secrets or database URLs) with
#   CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID set and fails the deploy on
#   non-zero exit (auth reads require a cache-disabled config; no
#   --allow-skip in real deploys). The Worker also refuses to serve traffic
#   without HYPERDRIVE_CACHING_DISABLED=1, set in the generated config only
#   after the gate passes for that env's Hyperdrive config. Until the
#   Operator wires the staging variables, the job skips with a notice (a
#   skip is not deploy evidence). Production is never touched: the job has
#   no production marker in code and deploys `--env staging` only.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# No workflow-level concurrency here: it would hold the deploy group for
# the whole run, now including up to ~40 min of post-deploy E2E, so queued
# main pushes would be cancelled before ever deploying. The deploy jobs
# serialize on their own job-level groups below and release them when the
# deploy finishes; E2E serializes separately on the e2e-staging group.

env:
  NODE_VERSION: "24"
  PNPM_VERSION: 10.34.7
  WRANGLER_VERSION: 4.153.0

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  staging-web:
    name: staging-web
    needs: [gate]
    if: ${{ github.event_name == 'push' && needs.gate.outputs.enabled == 'true' }}
    # Job-level (not workflow-level) so the group releases when the deploy
    # finishes instead of being held through the post-deploy E2E tail.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Push-to-main staging record (see the header): no rules, no secrets.
    environment:
      name: staging
      url: https://staging.nntune.com
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Deploy to staging
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          packageManager: pnpm
          workingDirectory: apps/web
          command: deploy --env staging

  # Api Worker staging lane (staging only; stream/repair/transcode are
  # follow-up jobs, each with its own evidence; mb/ingest lanes follow
  # below). Push to `main` only, gated
  # on the same token gate as staging-web. Serves the staging host on
  # /v1/* and /healthz plus the staging-only /api/test-codes and
  # /api/test-accounts seams and the plan-cap-guarded POST /api/ingest
  # intake (routes derived from API_RP_ID_STAGING);
  # the web Worker owns the catch-all. Passes the
  # public BUILD_SHA var so worker log records carry the deploy SHA (never
  # a secret); secrets live only in Cloudflare and are never written here.
  # Fails closed on the Hyperdrive cache-disabled gate (no --allow-skip);
  # skips with a notice until the Operator wires the staging variables (a
  # skip is not evidence).
  staging-api:
    name: staging-api
    needs: [gate]
    if: ${{ github.event_name == 'push' && needs.gate.outputs.enabled == 'true' }}
    # Own deploy group (never shared with staging-web): GitHub allows one
    # running plus one pending job per group, so sharing would let a push's
    # own lanes cancel each other and leave web and api at different SHAs.
    # Queued main pushes still deploy in order instead of racing wrangler.
    concurrency:
      group: ${{ github.workflow }}-staging-api-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Push-to-main staging record (see the header): no rules, no secrets.
    # Staging-scoped by name only — this lane never reads production
    # secrets or protection rules, and never deploys --env production.
    environment:
      name: staging
      url: https://staging.nntune.com
    outputs:
      deployed: ${{ steps.deployment.outputs.deployed }}
      outcome: ${{ steps.deployment.outputs.outcome }}
      source_sha: ${{ steps.deployment.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned SHA: `stable` branch HEAD (2026-10-09); re-pin deliberately,
      # never float (same pin as ci.yml).
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: wasm32-unknown-unknown
      - name: Check api staging configuration
        id: config
        working-directory: workers/api
        env:
          HYPERDRIVE_ID_STAGING: ${{ vars.HYPERDRIVE_ID_STAGING }}
          API_RP_ID_STAGING: ${{ vars.API_RP_ID_STAGING }}
          API_RP_ORIGIN_STAGING: ${{ vars.API_RP_ORIGIN_STAGING }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${HYPERDRIVE_ID_STAGING:-}" ] || missing="$missing HYPERDRIVE_ID_STAGING"
          [ -n "${API_RP_ID_STAGING:-}" ] || missing="$missing API_RP_ID_STAGING"
          [ -n "${API_RP_ORIGIN_STAGING:-}" ] || missing="$missing API_RP_ORIGIN_STAGING"
          if [ -n "$missing" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### staging-api skipped: staging not configured"
              echo "Missing repository variables (names only):$missing"
              echo "Wiring is Operator-owned; a skipped job is not deploy evidence."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Hyperdrive cache-disabled gate
        id: hyperdrive
        if: steps.config.outputs.configured == 'true'
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ./check_hyperdrive_cache.sh --config-id "${{ vars.HYPERDRIVE_ID_STAGING }}"
      - name: Generate staging wrangler.toml
        if: steps.config.outputs.configured == 'true'
        working-directory: workers/api
        env:
          HYPERDRIVE_ID_STAGING: ${{ vars.HYPERDRIVE_ID_STAGING }}
          API_RP_ID_STAGING: ${{ vars.API_RP_ID_STAGING }}
          API_RP_ORIGIN_STAGING: ${{ vars.API_RP_ORIGIN_STAGING }}
        run: |
          set -euo pipefail
          # The Worker refuses to start unless RP_ORIGIN is the canonical
          # serialized https origin whose host is exactly RP_ID: fail the
          # job here (names only) instead of deploying a worker that 500s.
          python3 - <<'PY'
          import os, re, tomllib, urllib.parse
          rp_id = os.environ["API_RP_ID_STAGING"]
          origin = os.environ["API_RP_ORIGIN_STAGING"]
          parts = urllib.parse.urlsplit(origin)
          assert parts.scheme == "https", "API_RP_ORIGIN_STAGING must be https"
          assert parts.hostname == rp_id, "API_RP_ORIGIN_STAGING host must equal API_RP_ID_STAGING"
          assert origin == f"https://{rp_id}", "API_RP_ORIGIN_STAGING must be the canonical serialized origin"
          assert re.fullmatch(r"[a-z0-9](?:[a-z0-9.-]*[a-z0-9])?", rp_id or ""), \
              "API_RP_ID_STAGING must be a bare lowercase hostname (route host)"
          # Exact-host pin: a stale var (e.g. the superseded v2-staging
          # host) would pass the shape checks above and silently split the
          # api routes onto the old host while the web catch-all serves
          # the new one. Fail the job here instead (names only).
          assert rp_id == "staging.nntune.com", \
              "API_RP_ID_STAGING must equal the staging RP ID (staging.nntune.com)"
          # Parity pin: the generated config binds HYPERDRIVE_ID_STAGING
          # directly, bypassing binding-parity (which only reads the
          # committed example). Fail unless it equals the committed staging
          # inventory id for the api HYPERDRIVE binding (names only).
          with open("../../.github/scripts/binding_manifest.toml", "rb") as f:
              manifest = tomllib.load(f)
          api = next(w for w in manifest["worker"] if w["name"] == "api")
          expected = next(b for b in api["binding"] if b["binding"] == "HYPERDRIVE")["staging"]
          assert os.environ["HYPERDRIVE_ID_STAGING"] == expected, \
              "HYPERDRIVE_ID_STAGING must equal the api staging inventory id"
          PY
          # Generated, never committed: bindings + public vars only, no
          # secrets. HYPERDRIVE_CACHING_DISABLED=1 is set here only because
          # the gate step above passed for this env's Hyperdrive config
          # (runtime attestation; the Worker refuses traffic otherwise).
          cat > wrangler.toml <<EOF
          # GENERATED by deploy.yml staging-api from public repo variables.
          # Do not edit or commit: secrets live in Cloudflare, ids in vars.
          name = "nntune-api"
          main = "build/worker/shim.mjs"
          compatibility_date = "2026-10-01"

          [build]
          command = "cargo install -q worker-build --locked && worker-build --release -- --locked"

          [env.staging]
          name = "nntune-api-staging"

          # Same-host split: this Worker serves /v1/*, /healthz, plus the
          # staging-only /api/test-codes and /api/test-accounts seams and
          # the plan-cap-guarded POST /api/ingest intake on
          # the staging host, while
          # the web Worker owns the catch-all (see apps/web/wrangler.toml);
          # the most specific route wins. Route hosts derive from
          # API_RP_ID_STAGING (asserted the exact staging host above), so
          # the RP pair and the serving host cannot drift apart.
          [[env.staging.routes]]
          pattern = "${API_RP_ID_STAGING}/v1/*"
          zone_name = "nntune.com"
          [[env.staging.routes]]
          pattern = "${API_RP_ID_STAGING}/api/test-codes"
          zone_name = "nntune.com"
          [[env.staging.routes]]
          pattern = "${API_RP_ID_STAGING}/api/test-accounts"
          zone_name = "nntune.com"
          [[env.staging.routes]]
          pattern = "${API_RP_ID_STAGING}/healthz"
          zone_name = "nntune.com"
          # Plan-cap intake (not a QA seam): authenticated callers only;
          # over-cap accounts get the plan-limit refusal, everyone else
          # falls through to the in-handler 404 until the write path lands.
          [[env.staging.routes]]
          pattern = "${API_RP_ID_STAGING}/api/ingest"
          zone_name = "nntune.com"

          [env.staging.vars]
          RP_ID = "${API_RP_ID_STAGING}"
          RP_ORIGIN = "${API_RP_ORIGIN_STAGING}"
          SESSION_TTL_SECS = "86400"
          HYPERDRIVE_CACHING_DISABLED = "1"
          # Arms the staging-only QA seams (POST /api/test-codes and
          # POST /api/test-accounts). They still answer 404 unless the
          # Worker also holds the QA_AUTH_TOKEN secret. Never set in
          # deploy-production.yml.
          QA_CODE_SEAM = "1"

          # Workers Logs persistence for the structured api records (the
          # build_sha evidence is read there). Without this block the
          # deployed Worker has observability=null and persists nothing.
          [env.staging.observability]
          enabled = true
          head_sampling_rate = 1

          [[env.staging.tail_consumers]]
          service = "nntune-alerts-staging"

          [[env.staging.hyperdrive]]
          binding = "HYPERDRIVE"
          id = "${HYPERDRIVE_ID_STAGING}"
          EOF
      - name: Ensure staging schema-check client
        if: steps.config.outputs.configured == 'true'
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null || [ ! -r /etc/ssl/certs/ca-certificates.crt ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-client ca-certificates
          fi
          test -r /etc/ssl/certs/ca-certificates.crt
      - name: Verify actual staging session schema (read-only)
        id: schema
        if: steps.config.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HYPERDRIVE_ID_STAGING: ${{ vars.HYPERDRIVE_ID_STAGING }}
          PLANETSCALE_MIGRATOR_URL_STAGING: ${{ secrets.PLANETSCALE_MIGRATOR_URL_STAGING }}
        run: python3 .github/scripts/staging_api_schema_gate.py
      - name: Deploy api to staging
        id: deploy
        if: steps.config.outputs.configured == 'true' && steps.schema.outcome == 'success'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          workingDirectory: workers/api
          command: deploy --env staging --var BUILD_SHA:${{ github.sha }}
      # Always report the executed step outcomes, including safe config skips
      # and failures. A green job alone is not evidence of a deployed Worker.
      - name: Record API deployment outcome
        id: deployment
        if: always()
        env:
          CONFIGURED: ${{ steps.config.outputs.configured }}
          HYPERDRIVE_OUTCOME: ${{ steps.hyperdrive.outcome }}
          SCHEMA_OUTCOME: ${{ steps.schema.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          JOB_STATUS: ${{ job.status }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          deployed=false
          outcome=failed
          source_sha=""
          if [ "$JOB_STATUS" = cancelled ]; then
            outcome=cancelled
          elif [ "$JOB_STATUS" = success ] && [ "$CONFIGURED" = false ]; then
            outcome=unconfigured
          elif [ "$JOB_STATUS" = success ] && [ "$CONFIGURED" = true ] && \
               [ "$HYPERDRIVE_OUTCOME" = success ] && [ "${SCHEMA_OUTCOME:-}" = success ] && \
               [ "$DEPLOY_OUTCOME" = success ]; then
            deployed=true
            outcome=deployed
            source_sha="$SOURCE_SHA"
          fi
          {
            echo "deployed=$deployed"
            echo "outcome=$outcome"
            echo "source_sha=$source_sha"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### staging-api deployment outcome: $outcome"
            echo "Worker: nntune-api-staging (env staging)"
            echo "deployed=$deployed"
            echo "Hyperdrive cache-disabled gate: ${HYPERDRIVE_OUTCOME:-not-run}"
            echo "Read-only session schema gate: ${SCHEMA_OUTCOME:-not-run}"
            echo "Deploy api to staging: ${DEPLOY_OUTCOME:-not-run}"
            if [ "$deployed" = true ]; then
              echo "Source SHA: $source_sha"
              echo "BUILD_SHA var: $source_sha"
            fi
            echo "Deployment marker only; not health, rollback or full staging acceptance evidence."
          } >> "$GITHUB_STEP_SUMMARY"

  # MB mirror Worker staging lane (staging only). Push to `main` only, gated
  # on the same token gate as staging-web. Deploys the mb Worker to its
  # `staging` env (`nntune-mb-staging`): no routes and no workers_dev — the
  # only caller is the ingest Worker's `MB_API` service binding, so there is
  # no HTTP surface to serve. Passes the public BUILD_SHA var so worker log
  # records carry the deploy SHA (never a secret); secrets live only in
  # Cloudflare and are never written here. The MB mirror Hyperdrive config is
  # a shared read mirror and may stay cached, so there is no cache-disabled
  # gate here (unlike the app Hyperdrive lanes). Skips with a notice until
  # the Operator wires HYPERDRIVE_ID_MB (a skip is not evidence). Production
  # is never touched: the generated config has no production env table and
  # the job deploys `--env staging` only.
  staging-mb:
    name: staging-mb
    needs: [gate]
    if: ${{ github.event_name == 'push' && needs.gate.outputs.enabled == 'true' }}
    # Own deploy group (never shared with the other lanes): GitHub allows one
    # running plus one pending job per group, so sharing would let a push's
    # own lanes cancel each other. Queued main pushes still deploy in order
    # instead of racing wrangler.
    concurrency:
      group: ${{ github.workflow }}-staging-mb-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Push-to-main staging record (see the header): no rules, no secrets.
    # Staging-scoped by name only — this lane never reads production
    # secrets or protection rules, and never deploys --env production.
    environment:
      name: staging
      url: https://staging.nntune.com
    outputs:
      deployed: ${{ steps.deployment.outputs.deployed }}
      outcome: ${{ steps.deployment.outputs.outcome }}
      source_sha: ${{ steps.deployment.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned SHA: `stable` branch HEAD (2026-10-09); re-pin deliberately,
      # never float (same pin as ci.yml).
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: wasm32-unknown-unknown
      - name: Check mb staging configuration
        id: config
        working-directory: workers/mb
        env:
          HYPERDRIVE_ID_MB: ${{ vars.HYPERDRIVE_ID_MB }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${HYPERDRIVE_ID_MB:-}" ] || missing="$missing HYPERDRIVE_ID_MB"
          if [ -n "$missing" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### staging-mb skipped: staging not configured"
              echo "Missing repository variables (names only):$missing"
              echo "Wiring is Operator-owned; a skipped job is not deploy evidence."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate staging wrangler.toml
        if: steps.config.outputs.configured == 'true'
        working-directory: workers/mb
        env:
          HYPERDRIVE_ID_MB: ${{ vars.HYPERDRIVE_ID_MB }}
        run: |
          set -euo pipefail
          # The generated config is derived from the parity manifest
          # (.github/scripts/binding_manifest.toml), which binding-parity
          # already diffs against the committed wrangler.toml and docs/ops.md:
          # values here cannot drift from the committed staging section
          # without failing the pin below. Secrets are never written here;
          # they live only in Cloudflare.
          python3 - <<'PY'
          import os, textwrap, tomllib
          with open("../../.github/scripts/binding_manifest.toml", "rb") as f:
              manifest = tomllib.load(f)
          mb = next(w for w in manifest["worker"] if w["name"] == "mb")
          def staged(binding):
              return next(b for b in mb["binding"] if b["binding"] == binding)["staging"]
          # Parity pin: the generated config binds HYPERDRIVE_ID_MB directly.
          # Fail unless it equals the committed staging inventory id for MB_DB.
          hyperdrive_id = os.environ["HYPERDRIVE_ID_MB"]
          assert hyperdrive_id == staged("MB_DB"), \
              "HYPERDRIVE_ID_MB must equal the mb MB_DB staging inventory id"
          kv_id = staged("MB_CACHE")
          art_bucket = staged("ART_CACHE")
          toml = textwrap.dedent(f"""\
          # GENERATED by deploy.yml staging-mb from public repo variables,
          # pinned to .github/scripts/binding_manifest.toml. Do not edit or
          # commit: secrets live in Cloudflare, ids in vars.
          name = "nntune-mb-production"
          main = "build/worker/shim.mjs"
          compatibility_date = "2026-10-01"
          workers_dev = false

          [build]
          command = "cargo install -q worker-build --locked && worker-build --release"

          [env.staging]
          name = "nntune-mb-staging"
          workers_dev = false

          [env.staging.vars]
          ENVIRONMENT = "staging"

          # Workers Logs persistence for the structured mb records (the
          # build_sha evidence is read there). Without this block the
          # deployed Worker has observability=null and persists nothing.
          [env.staging.observability]
          enabled = true
          head_sampling_rate = 1

          [[env.staging.tail_consumers]]
          service = "nntune-alerts-staging"

          [[env.staging.hyperdrive]]
          binding = "MB_DB"
          id = "{hyperdrive_id}"

          [[env.staging.kv_namespaces]]
          binding = "MB_CACHE"
          id = "{kv_id}"

          [[env.staging.r2_buckets]]
          binding = "ART_CACHE"
          bucket_name = "{art_bucket}"
          """)
          with open("wrangler.toml", "w") as f:
              f.write(toml)
          PY
      - name: Deploy mb to staging
        id: deploy
        if: steps.config.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          workingDirectory: workers/mb
          command: deploy --env staging --var BUILD_SHA:${{ github.sha }}
      # Always report the executed step outcomes, including safe config skips
      # and failures. A green job alone is not evidence of a deployed Worker.
      - name: Record mb deployment outcome
        id: deployment
        if: always()
        env:
          CONFIGURED: ${{ steps.config.outputs.configured }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          JOB_STATUS: ${{ job.status }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          deployed=false
          outcome=failed
          source_sha=""
          if [ "$JOB_STATUS" = cancelled ]; then
            outcome=cancelled
          elif [ "$JOB_STATUS" = success ] && [ "$CONFIGURED" = false ]; then
            outcome=unconfigured
          elif [ "$JOB_STATUS" = success ] && [ "$CONFIGURED" = true ] && \
               [ "$DEPLOY_OUTCOME" = success ]; then
            deployed=true
            outcome=deployed
            source_sha="$SOURCE_SHA"
          fi
          {
            echo "deployed=$deployed"
            echo "outcome=$outcome"
            echo "source_sha=$source_sha"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### staging-mb deployment outcome: $outcome"
            echo "Worker: nntune-mb-staging (env staging)"
            echo "deployed=$deployed"
            echo "Deploy mb to staging: ${DEPLOY_OUTCOME:-not-run}"
            if [ "$deployed" = true ]; then
              echo "Source SHA: $source_sha"
              echo "BUILD_SHA var: $source_sha"
            fi
            echo "Deployment marker only; not health, rollback or full staging acceptance evidence."
          } >> "$GITHUB_STEP_SUMMARY"

  # Ingest pipeline Worker staging lane (staging only). Push to `main` only,
  # gated on the same token gate as staging-web, and ordered after
  # `staging-mb` (its `MB_API` service binding targets `nntune-mb-staging`,
  # which that lane deploys first; Cloudflare fails a deploy whose
  # service-binding target does not exist). Deploys the ingest Worker to its
  # `staging` env: no routes and no workers_dev, with a LIVE
  # `[[queues.consumers]]` stanza — the consumer goes live on deploy, so
  # this lane carries its own disabled-by-default enable gate
  # (INGEST_STAGING_ENABLED): the Operator sets it only after TWO-1660
  # closes search intake, since a search job admitted before the search
  # boundary is wired would burn its retry budget against the unwired
  # boundary and quarantine. The shared HYPERDRIVE_ID_STAGING var alone
  # never enables this lane (the staging-api lane already needs it wired).
  # The deploy additionally requires staging-mb deployed on the same run
  # (its `MB_API` service binding targets `nntune-mb-staging`); when mb
  # skips unconfigured, ingest skips with a notice instead of failing on
  # the missing target. Passes the public BUILD_SHA var so
  # worker log records carry the deploy SHA (never a secret); secrets live
  # only in Cloudflare and are never written here. Fails closed on the
  # Hyperdrive cache-disabled gate for the shared app staging config
  # (no --allow-skip); skips with a notice until the Operator wires the
  # staging variables and enables the lane (a skip is not evidence).
  # Production is never touched:
  # the generated config has no production env table and the job deploys
  # `--env staging` only.
  staging-ingest:
    name: staging-ingest
    needs: [gate, staging-mb]
    if: ${{ github.event_name == 'push' && needs.gate.outputs.enabled == 'true' }}
    # Own deploy group (never shared with the other lanes): GitHub allows one
    # running plus one pending job per group, so sharing would let a push's
    # own lanes cancel each other. Queued main pushes still deploy in order
    # instead of racing wrangler.
    concurrency:
      group: ${{ github.workflow }}-staging-ingest-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Push-to-main staging record (see the header): no rules, no secrets.
    # Staging-scoped by name only — this lane never reads production
    # secrets or protection rules, and never deploys --env production.
    environment:
      name: staging
      url: https://staging.nntune.com
    outputs:
      deployed: ${{ steps.deployment.outputs.deployed }}
      outcome: ${{ steps.deployment.outputs.outcome }}
      source_sha: ${{ steps.deployment.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned SHA: `stable` branch HEAD (2026-10-09); re-pin deliberately,
      # never float (same pin as ci.yml).
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: wasm32-unknown-unknown
      - name: Check ingest staging configuration
        id: config
        working-directory: workers/ingest
        env:
          HYPERDRIVE_ID_STAGING: ${{ vars.HYPERDRIVE_ID_STAGING }}
          INGEST_STAGING_ENABLED: ${{ vars.INGEST_STAGING_ENABLED }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${HYPERDRIVE_ID_STAGING:-}" ] || missing="$missing HYPERDRIVE_ID_STAGING"
          if [ -n "$missing" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### staging-ingest skipped: staging not configured"
              echo "Missing repository variables (names only):$missing"
              echo "Wiring is Operator-owned; a skipped job is not deploy evidence."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
          # Disabled-by-default enable gate: the shared HYPERDRIVE_ID_STAGING
          # var alone never enables this lane (the staging-api lane already
          # needs it wired). The Operator sets INGEST_STAGING_ENABLED only
          # after search intake closes (runbook step 1); until then every
          # downstream step skips and the live consumer never deploys.
          if [ "${INGEST_STAGING_ENABLED:-}" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "### staging-ingest skipped: lane not enabled"
              echo "INGEST_STAGING_ENABLED is not true (name only; disabled by default)."
              echo "Enable only after search intake closes — runbook step 1."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Hyperdrive cache-disabled gate
        id: hyperdrive
        if: steps.config.outputs.configured == 'true' && steps.config.outputs.enabled == 'true'
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ./check_hyperdrive_cache.sh --config-id "${{ vars.HYPERDRIVE_ID_STAGING }}"
      - name: Generate staging wrangler.toml
        if: steps.config.outputs.configured == 'true' && steps.config.outputs.enabled == 'true'
        working-directory: workers/ingest
        env:
          HYPERDRIVE_ID_STAGING: ${{ vars.HYPERDRIVE_ID_STAGING }}
        run: |
          set -euo pipefail
          # The generated config is derived from the parity manifest
          # (.github/scripts/binding_manifest.toml), which binding-parity
          # already diffs against the committed wrangler.toml and docs/ops.md:
          # values here cannot drift from the committed staging section
          # without failing the pin below. Staging omits NNTP_POOL,
          # REPAIR_CONTAINER and TRANSCODE_CONTAINER (targets do not exist;
          # Cloudflare fails a deploy whose service-binding target is
          # missing) — re-add per environment once each target Worker
          # deploys; see the runbook in docs/ops.md. Secrets are never
          # written here; they live only in Cloudflare.
          python3 - <<'PY'
          import os, textwrap, tomllib
          with open("../../.github/scripts/binding_manifest.toml", "rb") as f:
              manifest = tomllib.load(f)
          ingest = next(w for w in manifest["worker"] if w["name"] == "ingest")
          def staged(binding):
              return next(b for b in ingest["binding"] if b["binding"] == binding)["staging"]
          # Parity pin: the generated config binds HYPERDRIVE_ID_STAGING
          # directly for LIBRARY_DB. Fail unless it equals the committed
          # staging inventory id.
          library_id = os.environ["HYPERDRIVE_ID_STAGING"]
          assert library_id == staged("LIBRARY_DB"), \
              "HYPERDRIVE_ID_STAGING must equal the ingest LIBRARY_DB staging inventory id"
          queue = staged("INGEST_QUEUE")
          dlq = staged("INGEST_DLQ")
          state_id = staged("INGEST_STATE")
          payloads_id = staged("INGEST_PAYLOADS")
          scratch_bucket = staged("INGEST_SCRATCH")
          audio_bucket = staged("AUDIO_PUBLISH")
          toml = textwrap.dedent(f"""\
          # GENERATED by deploy.yml staging-ingest from public repo variables,
          # pinned to .github/scripts/binding_manifest.toml. Do not edit or
          # commit: secrets live in Cloudflare, ids in vars.
          name = "nntune-ingest"
          main = "build/worker/shim.mjs"
          compatibility_date = "2026-10-01"
          workers_dev = false

          [build]
          command = "cargo install -q worker-build --locked && worker-build --release"

          [env.staging]
          name = "nntune-ingest-staging"
          workers_dev = false

          [env.staging.vars]
          AUDIO_BUCKET_NAME = "{audio_bucket}"

          # Workers Logs persistence for the structured ingest records (the
          # build_sha evidence is read there). Without this block the
          # deployed Worker has observability=null and persists nothing.
          [env.staging.observability]
          enabled = true
          head_sampling_rate = 1

          [[env.staging.tail_consumers]]
          service = "nntune-alerts-staging"

          [[env.staging.queues.producers]]
          binding = "INGEST_QUEUE"
          queue = "{queue}"

          [[env.staging.queues.producers]]
          binding = "INGEST_DLQ"
          queue = "{dlq}"

          # LIVE consumer: the consumer goes live the moment this environment
          # deploys. This lane must stay operator-disabled until TWO-1660
          # closes search intake. max_retries = CONSUMER_MAX_RETRIES (4) in
          # src/retry.rs: it equals PAYLOAD_RETRY_ATTEMPTS in src/dispatch.rs
          # and MAX_ATTEMPTS - 1 in src/jobs.rs.
          [[env.staging.queues.consumers]]
          queue = "{queue}"
          max_batch_size = 10
          max_retries = 4
          dead_letter_queue = "{dlq}"

          [[env.staging.hyperdrive]]
          binding = "LIBRARY_DB"
          id = "{library_id}"

          [[env.staging.kv_namespaces]]
          binding = "INGEST_STATE"
          id = "{state_id}"

          [[env.staging.kv_namespaces]]
          binding = "INGEST_PAYLOADS"
          id = "{payloads_id}"

          # Staging omits NNTP_POOL, REPAIR_CONTAINER and TRANSCODE_CONTAINER:
          # targets do not exist yet (see the header comment). Binding calls
          # resolve per request and degrade to transient retries when absent.

          [[env.staging.r2_buckets]]
          binding = "INGEST_SCRATCH"
          bucket_name = "{scratch_bucket}"

          [[env.staging.r2_buckets]]
          binding = "AUDIO_PUBLISH"
          bucket_name = "{audio_bucket}"

          [[env.staging.analytics_engine_datasets]]
          binding = "INGEST_METER"
          dataset = "nntune_ingest_meter"

          # MB read API in staging (code: src/matching.rs). The staging-mb lane
          # deploys `nntune-mb-staging` first; without it this deploy fails on
          # the missing service target.
          [[env.staging.services]]
          binding = "MB_API"
          service = "nntune-mb-staging"
          """)
          with open("wrangler.toml", "w") as f:
              f.write(toml)
          PY
      - name: Deploy ingest to staging
        id: deploy
        if: steps.config.outputs.configured == 'true' && steps.config.outputs.enabled == 'true' && steps.hyperdrive.outcome == 'success' && needs.staging-mb.outputs.deployed == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          workingDirectory: workers/ingest
          command: deploy --env staging --var BUILD_SHA:${{ github.sha }}
      # Always report the executed step outcomes, including safe config skips
      # and failures. A green job alone is not evidence of a deployed Worker.
      - name: Record ingest deployment outcome
        id: deployment
        if: always()
        env:
          CONFIGURED: ${{ steps.config.outputs.configured }}
          ENABLED: ${{ steps.config.outputs.enabled }}
          MB_DEPLOYED: ${{ needs.staging-mb.outputs.deployed }}
          HYPERDRIVE_OUTCOME: ${{ steps.hyperdrive.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          JOB_STATUS: ${{ job.status }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          deployed=false
          outcome=failed
          source_sha=""
          if [ "$JOB_STATUS" = cancelled ]; then
            outcome=cancelled
          elif [ "$JOB_STATUS" = success ] && [ "$CONFIGURED" = false ]; then
            outcome=unconfigured
          elif [ "$JOB_STATUS" = success ] && [ "$CONFIGURED" = true ] && [ "$ENABLED" = false ]; then
            outcome=disabled
          elif [ "$JOB_STATUS" = success ] && [ "$CONFIGURED" = true ] && [ "$ENABLED" = true ] && \
               [ "$MB_DEPLOYED" = false ]; then
            outcome=mb-not-deployed
          elif [ "$JOB_STATUS" = success ] && [ "$CONFIGURED" = true ] && [ "$ENABLED" = true ] && \
               [ "$MB_DEPLOYED" = true ] && [ "$HYPERDRIVE_OUTCOME" = success ] && \
               [ "$DEPLOY_OUTCOME" = success ]; then
            deployed=true
            outcome=deployed
            source_sha="$SOURCE_SHA"
          fi
          {
            echo "deployed=$deployed"
            echo "outcome=$outcome"
            echo "source_sha=$source_sha"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### staging-ingest deployment outcome: $outcome"
            echo "Worker: nntune-ingest-staging (env staging)"
            echo "deployed=$deployed"
            echo "Enable gate (INGEST_STAGING_ENABLED): ${ENABLED:-not-run}"
            echo "staging-mb deployed this run: ${MB_DEPLOYED:-not-run}"
            echo "Hyperdrive cache-disabled gate: ${HYPERDRIVE_OUTCOME:-not-run}"
            echo "Deploy ingest to staging: ${DEPLOY_OUTCOME:-not-run}"
            if [ "$outcome" = "disabled" ]; then
              echo "Lane is operator-disabled by default; set INGEST_STAGING_ENABLED only after search intake closes (runbook step 1)."
            fi
            if [ "$outcome" = "mb-not-deployed" ]; then
              echo "staging-mb did not deploy this run (wire HYPERDRIVE_ID_MB first); ingest skips rather than failing on the missing MB_API target."
            fi
            if [ "$deployed" = true ]; then
              echo "Source SHA: $source_sha"
              echo "BUILD_SHA var: $source_sha"
            fi
            echo "Deployment marker only; not health, rollback or full staging acceptance evidence."
          } >> "$GITHUB_STEP_SUMMARY"

  # Post-deploy staging E2E (same run, same revision as the deploys above).
  # No always()/!cancelled(): with the implicit success() gate, this job is
  # skipped whenever `staging-web` or `staging-api` is skipped (gate
  # disabled / non-push), fails or is cancelled, so it can never report a
  # full-journey PASS without both deploys finishing first. A failed api
  # deploy already turns the run red; running the journey against the
  # previous api would only add misleading evidence. An unconfigured api
  # lane still succeeds (outcome=unconfigured), so the journey runs.
  # Secrets are passed explicitly (never `inherit`) and match
  # exactly the names e2e-staging.yml reads. The promotion SHA (github.sha)
  # is passed as expected_sha so the build-identity spec can prove the
  # serving build is the promoted one — never a source checkout.
  post-deploy-e2e:
    name: post-deploy-e2e
    needs: [staging-web, staging-api]
    if: ${{ github.event_name == 'push' }}
    permissions:
      contents: read
    uses: ./.github/workflows/e2e-staging.yml
    with:
      post_deploy: true
      expected_sha: ${{ github.sha }}
      # Same-run staging-api outcome, so build identity holds the API to
      # expected_sha only when it deployed this run and says web=API=head
      # is not claimed when it was unconfigured.
      api_deploy_outcome: ${{ needs.staging-api.outputs.outcome }}
    secrets:
      STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      QA_AUTH_TOKEN: ${{ secrets.QA_AUTH_TOKEN }}
      SYNTHETIC_NNTP_HOST: ${{ secrets.SYNTHETIC_NNTP_HOST }}
      SYNTHETIC_NNTP_PORT: ${{ secrets.SYNTHETIC_NNTP_PORT }}
      SYNTHETIC_NNTP_USER: ${{ secrets.SYNTHETIC_NNTP_USER }}
      SYNTHETIC_NNTP_TLS: ${{ secrets.SYNTHETIC_NNTP_TLS }}
      SYNTHETIC_NNTP_PASS: ${{ secrets.SYNTHETIC_NNTP_PASS }}
      # No NZB fixture secrets are passed: the staging real-NZB leg is
      # retired under the CC0-only fixture rule (see e2e-staging.yml).
