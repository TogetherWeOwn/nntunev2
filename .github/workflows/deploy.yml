name: deploy

# Staging deploys + per-PR web previews (apps/web only).
#
# - Push to `main` deploys apps/web to its `staging` env, then the
#   `post-deploy-e2e` job calls e2e-staging.yml in the same run/revision.
#   That call is the only path to the full-journey staging E2E: it
#   `needs` `staging-web` with no always()/!cancelled(), so a skipped or
#   failed deploy cannot produce a full-journey PASS.
# - Pull requests get a live preview of apps/web (`wrangler preview`).
# - Both paths need the repo Actions secrets CLOUDFLARE_API_TOKEN and
#   CLOUDFLARE_ACCOUNT_ID (names only; the full account ID stays private).
#   When the token is absent, the jobs skip via the `gate` job below
#   (secrets cannot appear in a job-level `if`, so the gate maps the
#   token to an output) — CI stays green without deploying. Production
#   deploys are intentionally not wired here (a later gated lane adds
#   the promotion step; the staging evidence from this workflow is
#   web-only, see docs/ops.md).
# - Backend Worker deploys are intentionally NOT wired here: this
#   workflow deploys apps/web only. The Worker sources and entry points
#   exist under workers/ (api, ingest, stream, mb), but source existence
#   is not deployment or acceptance: backend binding activation,
#   migrations, health and rollback evidence are still outstanding
#   (docs/ops.md), and each backend deploy lane must add its own job
#   with that evidence before claiming a deployed Worker. When the API
#   Worker deploy job lands, it must call
#   workers/api/check_hyperdrive_cache.sh --config-id $HYPERDRIVE_ID_STAGING
#   (and prod; the HYPERDRIVE_ID_* names are non-credential Actions
#   variables, not secrets or database URLs) with
#   CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID set and fail
#   the deploy on non-zero exit (auth reads require a cache-disabled config).
#   Real deploys MUST NOT pass --allow-skip (CI-only); the Worker also
#   refuses to serve traffic without HYPERDRIVE_CACHING_DISABLED=1, set only
#   after the gate passes for that env's Hyperdrive config.
# - Public-repo note: fork PRs get no secrets, so preview skips there too.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

# No workflow-level concurrency here: it would hold the deploy group for
# the whole run, now including up to ~40 min of post-deploy E2E, so queued
# main pushes would be cancelled before ever deploying. The deploy jobs
# serialize on their own job-level groups below and release them when the
# deploy finishes; E2E serializes separately on the e2e-staging group.

env:
  NODE_VERSION: "24"
  PNPM_VERSION: 10.34.7
  WRANGLER_VERSION: 4.150.0

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  staging-web:
    name: staging-web
    needs: [gate]
    if: ${{ github.event_name == 'push' && needs.gate.outputs.enabled == 'true' }}
    # Job-level (not workflow-level) so the group releases when the deploy
    # finishes instead of being held through the post-deploy E2E tail.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Deploy to staging
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          packageManager: pnpm
          workingDirectory: apps/web
          command: deploy --env staging

  # Post-deploy staging E2E (same run, same revision as the deploy above).
  # No always()/!cancelled(): with the implicit success() gate, this job is
  # skipped whenever `staging-web` is skipped (gate disabled / non-push) or
  # fails, so it can never report a full-journey PASS without a successful
  # deploy first. Secrets are passed explicitly (never `inherit`) and match
  # exactly the names e2e-staging.yml reads.
  post-deploy-e2e:
    name: post-deploy-e2e
    needs: [staging-web]
    if: ${{ github.event_name == 'push' }}
    permissions:
      contents: read
    uses: ./.github/workflows/e2e-staging.yml
    with:
      post_deploy: true
    secrets:
      STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      QA_AUTH_TOKEN: ${{ secrets.QA_AUTH_TOKEN }}
      SYNTHETIC_NNTP_HOST: ${{ secrets.SYNTHETIC_NNTP_HOST }}
      SYNTHETIC_NNTP_PORT: ${{ secrets.SYNTHETIC_NNTP_PORT }}
      SYNTHETIC_NNTP_USER: ${{ secrets.SYNTHETIC_NNTP_USER }}
      SYNTHETIC_NNTP_TLS: ${{ secrets.SYNTHETIC_NNTP_TLS }}
      SYNTHETIC_NNTP_PASS: ${{ secrets.SYNTHETIC_NNTP_PASS }}

  preview-web:
    name: preview-web
    needs: [gate]
    if: ${{ github.event_name == 'pull_request' && needs.gate.outputs.enabled == 'true' }}
    # Job-level twin of staging-web above: per-PR serialization with
    # cancel-in-progress on PRs, never held by the E2E tail.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Publish PR preview
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          packageManager: pnpm
          workingDirectory: apps/web
          # Workers preview deployment (needs wrangler >= 4.136.3); with
          # gitHubToken the action writes the preview URL to the job summary
          # and a GitHub Deployment visible on the PR.
          command: preview
