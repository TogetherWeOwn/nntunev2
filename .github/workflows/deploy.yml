name: deploy

# Staging deploys + per-PR web previews (apps/web only).
#
# - Push to `main` deploys apps/web to its `staging` env, then the
#   `post-deploy-e2e` job calls e2e-staging.yml in the same run/revision.
#   That call is the only path to the full-journey staging E2E: it
#   `needs` `staging-web` with no always()/!cancelled(), so a skipped or
#   failed deploy cannot produce a full-journey PASS.
# - Pull requests get a live preview of apps/web (`wrangler preview`).
# - Both paths need the repo Actions secrets CLOUDFLARE_API_TOKEN and
#   CLOUDFLARE_ACCOUNT_ID (names only; the full account ID stays private).
#   When the token is absent, the jobs skip via the `gate` job below
#   (secrets cannot appear in a job-level `if`, so the gate maps the
#   token to an output) — CI stays green without deploying. Production
#   deploys are intentionally not wired here (a later gated lane adds
#   the promotion step; the staging evidence from this workflow is
#   web-only, see docs/ops.md).
# Backend Worker staging lane (api only; ingest/mb/stream/repair each add
#   their own job as follow-ups). The `staging-api` job below deploys the
#   api Worker to its `staging` env on push to `main` and passes the public
#   `BUILD_SHA` var (`--var BUILD_SHA:${{ github.sha }}`, never a secret),
#   so worker log records carry the 40-hex deploy SHA in `fields.build_sha`
#   instead of `"unknown"` (`workers/api/src/worker_entry.rs`). The staging
#   wrangler config is generated in the job from public repo variables and
#   is never committed; secrets live only in Cloudflare (Worker secrets set
#   with `wrangler secret put`) and CI secrets. Before deploying, the job
#   calls `workers/api/check_hyperdrive_cache.sh --config-id
#   $HYPERDRIVE_ID_STAGING` (the HYPERDRIVE_ID_* names are non-credential
#   Actions variables, not secrets or database URLs) with
#   CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID set and fails the deploy on
#   non-zero exit (auth reads require a cache-disabled config; no
#   --allow-skip in real deploys). The Worker also refuses to serve traffic
#   without HYPERDRIVE_CACHING_DISABLED=1, set in the generated config only
#   after the gate passes for that env's Hyperdrive config. Until the
#   Operator wires the staging variables, the job skips with a notice (a
#   skip is not deploy evidence). Production is never touched: the job has
#   no production marker in code and deploys `--env staging` only.
# - Public-repo note: fork PRs get no secrets, so preview skips there too.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

# Hold the source environment through plan/build/deploy/E2E/publication. The
# distinct job/reusable locks below must not reuse this writer key. GitHub may
# replace pending entries (not FIFO); only builds that actually deploy and pass
# acceptance receive a canary. Previews do not hold the main writer key.
concurrency:
  group: calver-web-${{ github.event_name == 'push' && 'main' || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  NODE_VERSION: "24"
  PNPM_VERSION: 10.34.7
  WRANGLER_VERSION: 4.150.0

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  staging-web:
    name: staging-web
    permissions:
      contents: read
      actions: read
    outputs:
      plan: ${{ steps.calver.outputs.plan }}
      artifact-id: ${{ steps.retained.outputs.artifact-id }}
      artifact-digest: ${{ steps.retained.outputs.artifact-digest }}
      artifact-name: certified-web-${{ github.run_id }}-${{ github.run_attempt }}
    needs: [gate]
    if: ${{ github.event_name == 'push' && needs.gate.outputs.enabled == 'true' }}
    # Job-level (not workflow-level) so the group releases when the deploy
    # finishes instead of being held through the post-deploy E2E tail.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Plan the web canary before building
        id: calver
        uses: TogetherWeOwn/.github/actions/calver@1508f2c10cb83bc0677e8e559ff796a55c66e737
        with:
          runs-on-json: '"ubuntu-latest"'
          request: |
            {"phase":"plan","input":{"channel":"canary","sha":"${{ github.sha }}","operation":"staging/${{ github.run_id }}/${{ github.run_attempt }}","policy":"staged-promotion","source":{"runId":${{ github.run_id }},"attempt":${{ github.run_attempt }},"workflow":".github/workflows/deploy.yml","jobs":["staging-web","post-deploy-e2e / synthetic smoke (health)","post-deploy-e2e / full journey (signup → byop → ingest → meter → limits)"]}}}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          BUILD_SHA: ${{ github.sha }}
          PUBLIC_API_BASE_URL: ''
      - name: Retain and verify the complete adapter output
        env:
          PLAN_JSON: ${{ steps.calver.outputs.plan }}
          RELEASE_VERSION: ${{ steps.calver.outputs.version }}
        run: |
          set -euo pipefail
          printf '%s\n' "$PLAN_JSON" > "$RUNNER_TEMP/web-plan.json"
          # Bundle the adapter's sibling server graph once, before retention.
          # All later uploads consume these modules with --no-bundle.
          WRANGLER_SEND_METRICS=false npx --yes wrangler@${{ env.WRANGLER_VERSION }} deploy --dry-run --env staging --outdir "$RUNNER_TEMP/web-bundle"
          python3 ../../ci/web-release-artifact.py package --root .svelte-kit/cloudflare --bundle-root "$RUNNER_TEMP/web-bundle" \
            --config wrangler.toml --plan "$RUNNER_TEMP/web-plan.json" \
            --repository "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --public-api-base-url '' --output "$RUNNER_TEMP/web-release.tar.gz"
          plan_id=$(jq -r '.id' "$RUNNER_TEMP/web-plan.json")
          python3 ../../ci/web-release-artifact.py verify --archive "$RUNNER_TEMP/web-release.tar.gz" \
            --repository "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --plan-id "$plan_id" --destination "$RUNNER_TEMP/web-retained" --require-portable
          python3 ../../ci/web-release-artifact.py render-config --verified-root "$RUNNER_TEMP/web-retained" \
            --source-config wrangler.toml --environment staging --release-version "$RELEASE_VERSION" --output "$RUNNER_TEMP/web-staging.toml"
      - name: Save the immutable web payload
        id: retained
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: certified-web-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/web-release.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Deploy to staging
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          packageManager: pnpm
          workingDirectory: apps/web
          command: deploy --env staging --config "${{ runner.temp }}/web-staging.toml" --no-bundle

  # Api Worker staging lane (staging only; ingest/mb/stream/repair are
  # follow-up jobs, each with its own evidence). Push to `main` only, gated
  # on the same token gate as staging-web. Serves the staging host on
  # /v1/* and /healthz plus the staging-only /api/test-codes seam
  # (routes derived from API_RP_ID_STAGING); the web Worker owns the
  # catch-all. Passes the
  # public BUILD_SHA var so worker log records carry the deploy SHA (never
  # a secret); secrets live only in Cloudflare and are never written here.
  # Fails closed on the Hyperdrive cache-disabled gate (no --allow-skip);
  # skips with a notice until the Operator wires the staging variables (a
  # skip is not evidence).
  staging-api:
    name: staging-api
    needs: [gate]
    if: ${{ github.event_name == 'push' && needs.gate.outputs.enabled == 'true' }}
    # Own deploy group (never shared with staging-web): GitHub allows one
    # running plus one pending job per group, so sharing would let a push's
    # own lanes cancel each other and leave web and api at different SHAs.
    # Queued main pushes still deploy in order instead of racing wrangler.
    concurrency:
      group: ${{ github.workflow }}-staging-api-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      deployed: ${{ steps.deployment.outputs.deployed }}
      outcome: ${{ steps.deployment.outputs.outcome }}
      source_sha: ${{ steps.deployment.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned SHA: `stable` branch HEAD (2026-10-09); re-pin deliberately,
      # never float (same pin as ci.yml).
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: wasm32-unknown-unknown
      - name: Check api staging configuration
        id: config
        working-directory: workers/api
        env:
          HYPERDRIVE_ID_STAGING: ${{ vars.HYPERDRIVE_ID_STAGING }}
          API_RP_ID_STAGING: ${{ vars.API_RP_ID_STAGING }}
          API_RP_ORIGIN_STAGING: ${{ vars.API_RP_ORIGIN_STAGING }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${HYPERDRIVE_ID_STAGING:-}" ] || missing="$missing HYPERDRIVE_ID_STAGING"
          [ -n "${API_RP_ID_STAGING:-}" ] || missing="$missing API_RP_ID_STAGING"
          [ -n "${API_RP_ORIGIN_STAGING:-}" ] || missing="$missing API_RP_ORIGIN_STAGING"
          if [ -n "$missing" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### staging-api skipped: staging not configured"
              echo "Missing repository variables (names only):$missing"
              echo "Wiring is Operator-owned; a skipped job is not deploy evidence."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Hyperdrive cache-disabled gate
        id: hyperdrive
        if: steps.config.outputs.configured == 'true'
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ./check_hyperdrive_cache.sh --config-id "${{ vars.HYPERDRIVE_ID_STAGING }}"
      - name: Generate staging wrangler.toml
        if: steps.config.outputs.configured == 'true'
        working-directory: workers/api
        env:
          HYPERDRIVE_ID_STAGING: ${{ vars.HYPERDRIVE_ID_STAGING }}
          API_RP_ID_STAGING: ${{ vars.API_RP_ID_STAGING }}
          API_RP_ORIGIN_STAGING: ${{ vars.API_RP_ORIGIN_STAGING }}
        run: |
          set -euo pipefail
          # The Worker refuses to start unless RP_ORIGIN is the canonical
          # serialized https origin whose host is exactly RP_ID: fail the
          # job here (names only) instead of deploying a worker that 500s.
          python3 - <<'PY'
          import os, re, tomllib, urllib.parse
          rp_id = os.environ["API_RP_ID_STAGING"]
          origin = os.environ["API_RP_ORIGIN_STAGING"]
          parts = urllib.parse.urlsplit(origin)
          assert parts.scheme == "https", "API_RP_ORIGIN_STAGING must be https"
          assert parts.hostname == rp_id, "API_RP_ORIGIN_STAGING host must equal API_RP_ID_STAGING"
          assert origin == f"https://{rp_id}", "API_RP_ORIGIN_STAGING must be the canonical serialized origin"
          assert re.fullmatch(r"[a-z0-9](?:[a-z0-9.-]*[a-z0-9])?", rp_id or ""), \
              "API_RP_ID_STAGING must be a bare lowercase hostname (route host)"
          # Exact-host pin: a stale var (e.g. the superseded v2-staging
          # host) would pass the shape checks above and silently split the
          # api routes onto the old host while the web catch-all serves
          # the new one. Fail the job here instead (names only).
          assert rp_id == "staging.nntune.com", \
              "API_RP_ID_STAGING must equal the staging RP ID (staging.nntune.com)"
          # Parity pin: the generated config binds HYPERDRIVE_ID_STAGING
          # directly, bypassing binding-parity (which only reads the
          # committed example). Fail unless it equals the committed staging
          # inventory id for the api HYPERDRIVE binding (names only).
          with open("../../.github/scripts/binding_manifest.toml", "rb") as f:
              manifest = tomllib.load(f)
          api = next(w for w in manifest["worker"] if w["name"] == "api")
          expected = next(b for b in api["binding"] if b["binding"] == "HYPERDRIVE")["staging"]
          assert os.environ["HYPERDRIVE_ID_STAGING"] == expected, \
              "HYPERDRIVE_ID_STAGING must equal the api staging inventory id"
          PY
          # Generated, never committed: bindings + public vars only, no
          # secrets. HYPERDRIVE_CACHING_DISABLED=1 is set here only because
          # the gate step above passed for this env's Hyperdrive config
          # (runtime attestation; the Worker refuses traffic otherwise).
          cat > wrangler.toml <<EOF
          # GENERATED by deploy.yml staging-api from public repo variables.
          # Do not edit or commit: secrets live in Cloudflare, ids in vars.
          name = "nntune-api"
          main = "build/worker/shim.mjs"
          compatibility_date = "2026-10-01"

          [build]
          command = "cargo install -q worker-build --locked && worker-build --release -- --locked"

          [env.staging]
          name = "nntune-api-staging"

          # Same-host split: this Worker serves /v1/*, /healthz, plus the
          # staging-only /api/test-codes seam on the staging host, while
          # the web Worker owns the catch-all (see apps/web/wrangler.toml);
          # the most specific route wins. Route hosts derive from
          # API_RP_ID_STAGING (asserted the exact staging host above), so
          # the RP pair and the serving host cannot drift apart.
          [[env.staging.routes]]
          pattern = "${API_RP_ID_STAGING}/v1/*"
          zone_name = "nntune.com"
          [[env.staging.routes]]
          pattern = "${API_RP_ID_STAGING}/api/test-codes"
          zone_name = "nntune.com"
          [[env.staging.routes]]
          pattern = "${API_RP_ID_STAGING}/healthz"
          zone_name = "nntune.com"

          [env.staging.vars]
          RP_ID = "${API_RP_ID_STAGING}"
          RP_ORIGIN = "${API_RP_ORIGIN_STAGING}"
          SESSION_TTL_SECS = "86400"
          HYPERDRIVE_CACHING_DISABLED = "1"

          # Workers Logs persistence for the structured api records (the
          # build_sha evidence is read there). Without this block the
          # deployed Worker has observability=null and persists nothing.
          [env.staging.observability]
          enabled = true
          head_sampling_rate = 1

          [[env.staging.tail_consumers]]
          service = "nntune-alerts-staging"

          [[env.staging.hyperdrive]]
          binding = "HYPERDRIVE"
          id = "${HYPERDRIVE_ID_STAGING}"
          EOF
      - name: Ensure staging schema-check client
        if: steps.config.outputs.configured == 'true'
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null || [ ! -r /etc/ssl/certs/ca-certificates.crt ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-client ca-certificates
          fi
          test -r /etc/ssl/certs/ca-certificates.crt
      - name: Verify actual staging session schema (read-only)
        id: schema
        if: steps.config.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HYPERDRIVE_ID_STAGING: ${{ vars.HYPERDRIVE_ID_STAGING }}
          PLANETSCALE_MIGRATOR_URL_STAGING: ${{ secrets.PLANETSCALE_MIGRATOR_URL_STAGING }}
        run: python3 .github/scripts/staging_api_schema_gate.py
      - name: Deploy api to staging
        id: deploy
        if: steps.config.outputs.configured == 'true' && steps.schema.outcome == 'success'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          workingDirectory: workers/api
          command: deploy --env staging --var BUILD_SHA:${{ github.sha }}
      # Always report the executed step outcomes, including safe config skips
      # and failures. A green job alone is not evidence of a deployed Worker.
      - name: Record API deployment outcome
        id: deployment
        if: always()
        env:
          CONFIGURED: ${{ steps.config.outputs.configured }}
          HYPERDRIVE_OUTCOME: ${{ steps.hyperdrive.outcome }}
          SCHEMA_OUTCOME: ${{ steps.schema.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          JOB_STATUS: ${{ job.status }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          deployed=false
          outcome=failed
          source_sha=""
          if [ "$JOB_STATUS" = cancelled ]; then
            outcome=cancelled
          elif [ "$JOB_STATUS" = success ] && [ "$CONFIGURED" = false ]; then
            outcome=unconfigured
          elif [ "$JOB_STATUS" = success ] && [ "$CONFIGURED" = true ] && \
               [ "$HYPERDRIVE_OUTCOME" = success ] && [ "${SCHEMA_OUTCOME:-}" = success ] && \
               [ "$DEPLOY_OUTCOME" = success ]; then
            deployed=true
            outcome=deployed
            source_sha="$SOURCE_SHA"
          fi
          {
            echo "deployed=$deployed"
            echo "outcome=$outcome"
            echo "source_sha=$source_sha"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### staging-api deployment outcome: $outcome"
            echo "Worker: nntune-api-staging (env staging)"
            echo "deployed=$deployed"
            echo "Hyperdrive cache-disabled gate: ${HYPERDRIVE_OUTCOME:-not-run}"
            echo "Read-only session schema gate: ${SCHEMA_OUTCOME:-not-run}"
            echo "Deploy api to staging: ${DEPLOY_OUTCOME:-not-run}"
            if [ "$deployed" = true ]; then
              echo "Source SHA: $source_sha"
              echo "BUILD_SHA var: $source_sha"
            fi
            echo "Deployment marker only; not health, rollback or full staging acceptance evidence."
          } >> "$GITHUB_STEP_SUMMARY"

  # Post-deploy staging E2E (same run, same revision as the deploy above).
  # No always()/!cancelled(): with the implicit success() gate, this job is
  # skipped whenever `staging-web` is skipped (gate disabled / non-push) or
  # fails, so it can never report a full-journey PASS without a successful
  # deploy first. Secrets are passed explicitly (never `inherit`) and match
  # exactly the names e2e-staging.yml reads. The promotion SHA (github.sha)
  # is passed as expected_sha so the build-identity spec can prove the
  # serving build is the promoted one — never a source checkout.
  post-deploy-e2e:
    name: post-deploy-e2e
    needs: [staging-web]
    if: ${{ github.event_name == 'push' }}
    permissions:
      contents: read
    uses: ./.github/workflows/e2e-staging.yml
    with:
      post_deploy: true
      expected_sha: ${{ github.sha }}
    secrets:
      STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      QA_AUTH_TOKEN: ${{ secrets.QA_AUTH_TOKEN }}
      SYNTHETIC_NNTP_HOST: ${{ secrets.SYNTHETIC_NNTP_HOST }}
      SYNTHETIC_NNTP_PORT: ${{ secrets.SYNTHETIC_NNTP_PORT }}
      SYNTHETIC_NNTP_USER: ${{ secrets.SYNTHETIC_NNTP_USER }}
      SYNTHETIC_NNTP_TLS: ${{ secrets.SYNTHETIC_NNTP_TLS }}
      SYNTHETIC_NNTP_PASS: ${{ secrets.SYNTHETIC_NNTP_PASS }}

  publish-web-canary:
    name: publish-web-canary
    needs: [staging-web, post-deploy-e2e]
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
      ARTIFACT_ID: ${{ needs.staging-web.outputs.artifact-id }}
      ARTIFACT_NAME: ${{ needs.staging-web.outputs.artifact-name }}
      ARTIFACT_DIGEST: sha256:${{ needs.staging-web.outputs.artifact-digest }}
      PLAN_JSON: ${{ needs.staging-web.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the exact source archive and executed acceptance
        id: certificate
        run: |
          set -euo pipefail
          python3 ci/web-release-evidence.py fetch --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --artifact-id "$ARTIFACT_ID" --artifact-name "$ARTIFACT_NAME" --artifact-digest "$ARTIFACT_DIGEST" \
            --output "$RUNNER_TEMP/web-evidence.json" --archive-output "$RUNNER_TEMP/web-release.tar.gz"
          plan_id=$(printf '%s' "$PLAN_JSON" | jq -r '.id')
          python3 ci/web-release-artifact.py verify --archive "$RUNNER_TEMP/web-release.tar.gz" \
            --repository "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --plan-id "$plan_id" --destination "$RUNNER_TEMP/web-certified" --require-portable
          if python3 ci/web-release-evidence.py certify --input "$RUNNER_TEMP/web-evidence.json" \
            --manifest "$RUNNER_TEMP/web-certified/manifest.json" --repository "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --workflow .github/workflows/deploy.yml \
            --artifact-id "$ARTIFACT_ID" --artifact-name "$ARTIFACT_NAME" --artifact-digest "$ARTIFACT_DIGEST" \
            --output "$RUNNER_TEMP/web-certificate.json" > "$RUNNER_TEMP/web-certification-result.json"; then
            echo 'eligible=true' >> "$GITHUB_OUTPUT"
            echo "evidence=$(jq -c '.evidence' "$RUNNER_TEMP/web-certificate.json")" >> "$GITHUB_OUTPUT"
          else
            # Unconfigured staging is not acceptance. Keep its existing no-op
            # posture but mint no certificate/tag; all other refusals are red.
            jq -e '.ok == false and .code == "acceptance-skipped"' "$RUNNER_TEMP/web-certification-result.json"
            echo 'eligible=false' >> "$GITHUB_OUTPUT"
            echo 'Web was not certified: acceptance skipped; no canary published.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish only the certified web canary
        if: steps.certificate.outputs.eligible == 'true'
        uses: TogetherWeOwn/.github/actions/calver@1508f2c10cb83bc0677e8e559ff796a55c66e737
        with:
          runs-on-json: '"ubuntu-latest"'
          request: |
            {"phase":"publish","plan":${{ needs.staging-web.outputs.plan }},"evidence":${{ steps.certificate.outputs.evidence }}}

  preview-web:
    name: preview-web
    needs: [gate]
    if: ${{ github.event_name == 'pull_request' && needs.gate.outputs.enabled == 'true' }}
    # Job-level twin of staging-web above: per-PR serialization with
    # cancel-in-progress on PRs, never held by the E2E tail.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Publish PR preview
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          packageManager: pnpm
          workingDirectory: apps/web
          # Workers preview deployment (needs wrangler >= 4.136.3); with
          # gitHubToken the action writes the preview URL to the job summary
          # and a GitHub Deployment visible on the PR.
          command: preview
