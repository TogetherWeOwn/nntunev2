name: preserved-source synthetic graph

# This is one qualification control, not an acquisition boundary or approval
# to consume a preserved source. The fixture creates only local Git objects.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited]

permissions:
  contents: read

concurrency:
  # A skipped event must never cancel an in-flight graph check for the PR.
  group: >-
    ${{ (contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action) ||
        (github.event.action == 'edited' &&
         !(github.event.sender.login == 'cubic-dev-ai[bot]' && github.event.changes.body != null &&
           github.event.changes.title == null && github.event.changes.base == null)) ||
        (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) &&
         !(github.event.sender.type == 'Bot' &&
           contains(fromJSON('["size/S","size/M","size/L","size/XL"]'), github.event.label.name)))) &&
        format('preserved-source-graph-{0}', github.event.pull_request.number) ||
        format('preserved-source-graph-skipped-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  synthetic-graph:
    name: Synthetic graph controls
    # Keep same-head refreshes via review-ready, edits and labels (#1069,
    # #1073). Filter automated summary-only edits and advisory size labels.
    if: >-
      ${{ (contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action) ||
          (github.event.action == 'edited' &&
           !(github.event.sender.login == 'cubic-dev-ai[bot]' && github.event.changes.body != null &&
             github.event.changes.title == null && github.event.changes.base == null)) ||
          (contains(fromJSON('["labeled","unlabeled"]'), github.event.action) &&
           !(github.event.sender.type == 'Bot' &&
             contains(fromJSON('["size/S","size/M","size/L","size/XL"]'), github.event.label.name)))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record tested merge, parents and Git version
        run: |
          git --version
          python3 -I .github/scripts/migrations_base.py >> "$GITHUB_OUTPUT"
      - name: Check workflow wiring
        run: python3 .github/scripts/test_preserved_source_graph_workflow.py -v
      - name: Exercise original graph and object refusal controls
        run: >-
          python3 .github/scripts/test_migrations_rename_check.py
          GitFixture.test_preserved_source_requires_original_graph_and_data_objects -v
