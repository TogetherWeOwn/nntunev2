name: Worker SDK inspection

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  worker-sdk-inspection:
    if: >-
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'chore/worker-sdk-clock-regressions'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Verify live pull request head
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '[.state, .draft, .head.repo.full_name, .head.ref, .head.sha] | @tsv' > "$RUNNER_TEMP/pr-state"
          IFS=$'\t' read -r state draft repository branch sha < "$RUNNER_TEMP/pr-state"
          test "$state" = open && test "$draft" = true
          test "$repository" = "$REPOSITORY" && test "$branch" = chore/worker-sdk-clock-regressions
          test "$sha" = "$EXPECTED_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Test inspection safeguards
        run: python3 -I .github/scripts/test_inspect_worker_archives.py
      - name: Inspect pristine Worker inputs
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 -I .github/scripts/inspect_worker_archives.py
