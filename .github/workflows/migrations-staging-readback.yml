name: migrations-staging-readback

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Observation type
        type: choice
        options:
          - readback
          - audit
          - purge-census
        default: readback
        required: true
      ref:
        description: Exact data commit SHA
        type: string
        required: true
      file:
        description: App migration basename
        type: string
        required: true
      sha256:
        description: Expected migration SHA256
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: migrations-staging-apply
  cancel-in-progress: false
  queue: max

jobs:
  readback:
    name: Read staging ledger row
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: staging
      deployment: false
    steps:
      - name: Validate dispatch
        env:
          WORKFLOW_REF: ${{ github.ref }}
          DATA_REF: ${{ inputs.ref }}
          FILE: ${{ inputs.file }}
          SHA: ${{ inputs.sha256 }}
        run: |
          set -euo pipefail
          [[ "$WORKFLOW_REF" == refs/heads/main ]]
          [[ "$DATA_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$FILE" =~ ^[0-9]{4}_[A-Za-z0-9_]+\.sql$ ]]
          [[ "$SHA" =~ ^[0-9a-f]{64}$ ]]

      - name: Check out data only
        if: ${{ inputs.mode != 'purge-census' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          path: data
          persist-credentials: false

      - name: Check out trusted code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false

      - name: Verify revisions
        env:
          MODE: ${{ inputs.mode }}
          DATA_REF: ${{ inputs.ref }}
          TRUSTED_REF: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          if [[ "$MODE" == purge-census ]]; then
            test "$REF_PROTECTED" = true && test "$WORKFLOW_SHA" = "$TRUSTED_REF" || exit 1
          else
            test "$(git -C data rev-parse HEAD)" = "$DATA_REF"
          fi
          test "$(git -C trusted rev-parse HEAD)" = "$TRUSTED_REF"
          command -v psql >/dev/null
          test -r /etc/ssl/certs/ca-certificates.crt

      - name: Audit complete staging ledger
        if: ${{ inputs.mode == 'audit' }}
        env:
          PLANETSCALE_MIGRATOR_URL_STAGING: ${{ secrets.PLANETSCALE_MIGRATOR_URL_STAGING }}
          DATA_REVISION: ${{ inputs.ref }}
          TRUSTED_REVISION: ${{ github.sha }}
          MIGRATION_FILE: ${{ inputs.file }}
          EXPECTED_SHA: ${{ inputs.sha256 }}
          AUDIT_RECEIPT: ledger-audit-receipt.json
        run: |
          set -euo pipefail
          python3 -E -s trusted/.github/scripts/staging_apply.py audit --trusted-root trusted --data-root data --file "$MIGRATION_FILE" --expected-sha "$EXPECTED_SHA" --expect-database nntunev2_staging

      - name: Upload sanitized audit receipt
        if: ${{ inputs.mode == 'audit' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staging-ledger-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ledger-audit-receipt.json
          retention-days: 7
          if-no-files-found: error

      - name: Observe ledger row
        if: ${{ inputs.mode == 'readback' }}
        env:
          PLANETSCALE_MIGRATOR_URL_STAGING: ${{ secrets.PLANETSCALE_MIGRATOR_URL_STAGING }}
          DATA_REVISION: ${{ inputs.ref }}
          TRUSTED_REVISION: ${{ github.sha }}
          MIGRATION_FILE: ${{ inputs.file }}
          EXPECTED_SHA: ${{ inputs.sha256 }}
          READBACK_RECEIPT: readback-receipt.json
        run: |
          set -euo pipefail
          python3 -E -s trusted/.github/scripts/staging_apply.py readback --data-root data --file "$MIGRATION_FILE" --expected-sha "$EXPECTED_SHA" --expect-database nntunev2_staging

      - name: Upload sanitized readback receipt
        if: ${{ inputs.mode == 'readback' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staging-ledger-readback-${{ github.run_id }}-${{ github.run_attempt }}
          path: readback-receipt.json
          retention-days: 7
          if-no-files-found: error

      - name: Observe staging purge census
        if: ${{ inputs.mode == 'purge-census' }}
        env:
          # Source-only: no independently approved SELECT binding is wired.
          DATA_REVISION: ${{ inputs.ref }}
          TRUSTED_REVISION: ${{ github.sha }}
          MIGRATION_FILE: ${{ inputs.file }}
          EXPECTED_SHA: ${{ inputs.sha256 }}
        run: |
          set -euo pipefail
          python3 -E -s trusted/.github/scripts/staging_apply.py purge-census --file "$MIGRATION_FILE" --expected-sha "$EXPECTED_SHA" --expect-database nntunev2_staging

      - name: Upload sanitized purge census receipt
        if: ${{ inputs.mode == 'purge-census' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staging-purge-census-${{ github.run_id }}-${{ github.run_attempt }}
          path: purge-census-receipt.json
          retention-days: 7
          if-no-files-found: error
