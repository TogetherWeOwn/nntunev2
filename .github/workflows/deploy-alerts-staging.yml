name: deploy-alerts-staging

# Staging Tail alert runtime deploy (frozen-source activation lane).
#
# - Push to `main` touching this file or the frozen observability modules
#   deploys `nntune-alerts-staging` (Tail consumer for `nntune-api-staging`)
#   with a staging wrangler config generated below (never committed),
#   derived from workers/observability/wrangler.toml.example.
# - Frozen source: the four runtime modules must be byte-identical to main
#   818e57680414 (PR #698); the freeze job fails closed otherwise, so a
#   later runtime change cannot silently redeploy under this activation.
# - No secret is provisioned here: OPS_ALERT_WEBHOOK_URL stays unset and
#   delivery stays fail-closed until the secret owner provisions it via
#   `wrangler secret put` (or the dashboard). No Tail attachment happens
#   here either; attachment is a separate reviewed operator step.
# - No prod: the worker name is allowlisted to nntune-alerts-staging, no
#   routes are configured, workers.dev is off, and consumer observability
#   (logs/traces/invocation logs) stays off so subrequest spans can never
#   capture the future secret URL.
# - Needs the repo Actions secrets CLOUDFLARE_API_TOKEN and
#   CLOUDFLARE_ACCOUNT_ID (names only; the full account ID stays private
#   and is only interpolated at runtime into LOGS_URL, never echoed).
#   Without the token the gate skips and CI stays green without deploying.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-alerts-staging.yml
      - workers/observability/runtime.mjs
      - workers/observability/project-tail-event.mjs
      - workers/observability/evaluate-error-window.mjs
      - workers/observability/render-verdict-alert.mjs
      - workers/observability/wrangler.toml.example

permissions:
  contents: read

env:
  WRANGLER_VERSION: 4.150.0
  FROZEN_SHA: 818e57680414c4414cc3c96e2f3f9a6ca38d80bf
  WORKER_NAME: nntune-alerts-staging
  PRODUCER_NAME: nntune-api-staging

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: deploy
    needs: [gate]
    if: ${{ github.event_name == 'push' && needs.gate.outputs.enabled == 'true' }}
    concurrency:
      group: deploy-alerts-staging-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Assert frozen runtime bytes
        run: |
          set -euo pipefail
          git cat-file -e "${FROZEN_SHA:?}" || { echo "::error::Frozen commit $FROZEN_SHA not in history"; exit 1; }
          if git diff --quiet "$FROZEN_SHA" HEAD -- \
              workers/observability/runtime.mjs \
              workers/observability/project-tail-event.mjs \
              workers/observability/evaluate-error-window.mjs \
              workers/observability/render-verdict-alert.mjs; then
            echo "runtime bytes identical to ${FROZEN_SHA:0:12}"
          else
            echo "::error::Runtime modules differ from frozen $FROZEN_SHA; refusing to deploy under this activation"
            git diff --stat "$FROZEN_SHA" HEAD -- workers/observability/ || true
            exit 1
          fi
          test "${WORKER_NAME:?}" = "nntune-alerts-staging" || { echo "::error::Worker name drift"; exit 1; }
      - name: Generate staging wrangler.toml
        working-directory: workers/observability
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # LOGS_URL is interpolated at runtime only; it is never echoed.
          LOGS_URL="https://dash.cloudflare.com/${CLOUDFLARE_ACCOUNT_ID}/workers/services/view/nntune-api-staging/observability/logs"
          python3 - "$LOGS_URL" <<'PY'
          import sys, urllib.parse
          url = sys.argv[1]
          parts = urllib.parse.urlsplit(url)
          assert url.startswith("https://"), "LOGS_URL must be https"
          assert len(url) <= 1024, "LOGS_URL too long"
          assert not parts.username and not parts.password, "LOGS_URL must not carry credentials"
          assert parts.hostname and parts.hostname != "discord.com", "LOGS_URL host rejected"
          assert not parts.path.startswith("/api/webhooks/"), "log links are never webhook endpoints"
          print("LOGS_URL shape ok")
          PY
          cat > wrangler.staging.toml <<EOF
          # GENERATED by deploy-alerts-staging.yml from the frozen example.
          # Do not edit or commit: secrets live in Cloudflare, ids in vars.
          name = "${WORKER_NAME}"
          main = "runtime.mjs"
          compatibility_date = "2026-10-01"
          workers_dev = false
          preview_urls = false
          send_metrics = false

          # Automatic subrequest spans must never capture the secret delivery endpoint.
          [observability]
          enabled = false

          [observability.logs]
          enabled = false
          invocation_logs = false

          [observability.traces]
          enabled = false

          [vars]
          PRODUCER_SCRIPT_NAME = "${PRODUCER_NAME}"
          LOGS_URL = "${LOGS_URL}"

          [[durable_objects.bindings]]
          name = "ALERT_WINDOWS"
          class_name = "ErrorRateAlerts"

          [[migrations]]
          tag = "v1"
          new_sqlite_classes = ["ErrorRateAlerts"]
          EOF
          # Confirm structure without printing values.
          grep -q '^name = "nntune-alerts-staging"$' wrangler.staging.toml
          grep -q '^main = "runtime.mjs"$' wrangler.staging.toml
          grep -q 'class_name = "ErrorRateAlerts"' wrangler.staging.toml
          grep -q 'tag = "v1"' wrangler.staging.toml
          echo "generated config structure ok"
      - name: Deploy alerts worker to staging
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          workingDirectory: workers/observability
          command: deploy --config wrangler.staging.toml
      - name: Verify staging deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers"
          authz="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          settings="$(curl -sSf -H "$authz" "$base/scripts/${WORKER_NAME}/settings")"
          namespaces="$(curl -sSf -H "$authz" "$base/durable_objects/namespaces")"
          subdomain="$(curl -sSf -H "$authz" "$base/scripts/${WORKER_NAME}/subdomain")"
          versions="$(curl -sSf -H "$authz" "$base/scripts/${WORKER_NAME}/versions?per_page=1")"
          EXPECTED_LOGS_URL="https://dash.cloudflare.com/${CLOUDFLARE_ACCOUNT_ID}/workers/services/view/nntune-api-staging/observability/logs" \
          PRODUCER_NAME="$PRODUCER_NAME" WORKER_NAME="$WORKER_NAME" \
          python3 - "$settings" "$namespaces" "$subdomain" "$versions" <<'PY'
          import json, os, sys
          settings = json.loads(sys.argv[1])["result"]
          namespaces = json.loads(sys.argv[2])["result"]
          subdomain = json.loads(sys.argv[3])
          versions = json.loads(sys.argv[4])["result"]
          worker = os.environ["WORKER_NAME"]
          producer = os.environ["PRODUCER_NAME"]
          expected_logs = os.environ["EXPECTED_LOGS_URL"]

          obs = settings.get("observability") or {}
          assert obs.get("enabled") is False, f"observability not off: {obs}"
          assert (obs.get("logs") or {}).get("enabled") is False, "logs not off"
          assert (obs.get("logs") or {}).get("invocation_logs") is False, "invocation logs not off"
          assert (obs.get("traces") or {}).get("enabled") is False, "traces not off"
          assert settings.get("compatibility_date") == "2026-10-01", "compat date drift"
          assert settings.get("tail_consumers") in (None, []), "unexpected tail consumers on new worker"

          by_name = {b["name"]: b for b in settings.get("bindings", [])}
          assert by_name.get("PRODUCER_SCRIPT_NAME", {}).get("text") == producer, "PRODUCER binding value"
          assert by_name.get("LOGS_URL", {}).get("text") == expected_logs, "LOGS_URL binding value"
          do_binding = by_name.get("ALERT_WINDOWS", {})
          assert do_binding.get("type") == "durable_object_namespace", "ALERT_WINDOWS type"
          assert do_binding.get("class_name") == "ErrorRateAlerts", "ALERT_WINDOWS class"
          assert do_binding.get("namespace_id"), "ALERT_WINDOWS has no namespace"
          assert "OPS_ALERT_WEBHOOK_URL" not in by_name, "secret must not be provisioned by this lane"
          assert set(by_name) == {"PRODUCER_SCRIPT_NAME", "LOGS_URL", "ALERT_WINDOWS"}, f"binding drift: {sorted(by_name)}"

          mine = [n for n in namespaces if n.get("script") == worker]
          assert len(mine) == 1 and mine[0].get("class") == "ErrorRateAlerts", f"DO namespace: {mine}"
          assert subdomain.get("result", {}).get("enabled") is False, f"workers.dev still on: {subdomain}"

          version_id = None
          items = versions.get("items") if isinstance(versions, dict) else versions
          if isinstance(items, list) and items:
              version_id = items[0].get("id")
          print(f"worker={worker}")
          print(f"version_id={version_id}")
          print(f"do_namespace_id={mine[0].get('id')}")
          print(f"do_namespace_name={mine[0].get('name')}")
          print(f"bindings={','.join(sorted(by_name))}")
          print("staging alerts deployment verified")
          PY
