name: deploy-alerts-staging

# Staging Tail alert runtime deploy (frozen-source activation lane).
# The tested guard generates a staging-only config from wrangler.toml.example.
# No secret is provisioned or Tail consumer attached here. A separately provisioned
# OPS_ALERT_WEBHOOK_URL secret_text binding is preserved, never fetched or logged.
# Consumer observability stays off; no routes, workers.dev or preview URLs.
# Missing CLOUDFLARE_API_TOKEN skips deployment, not proof of live monitoring.
# Scope, evidence and rollback: docs/runbook-observability.md.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-alerts-staging.yml
      - .github/scripts/alerts_staging.py
      - workers/observability/runtime.mjs
      - workers/observability/project-tail-event.mjs
      - workers/observability/evaluate-error-window.mjs
      - workers/observability/render-verdict-alert.mjs
      - workers/observability/wrangler.toml.example

permissions:
  contents: read

env:
  WRANGLER_VERSION: 4.153.0

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: deploy
    needs: [gate]
    if: ${{ github.event_name == 'push' && needs.gate.outputs.enabled == 'true' }}
    concurrency:
      group: deploy-alerts-staging-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Assert frozen runtime bytes
        run: python3 .github/scripts/alerts_staging.py freeze
      - name: Test staging deployment guards without network access
        run: python3 .github/scripts/test_alerts_staging.py
      - name: Generate staging wrangler.toml
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 .github/scripts/alerts_staging.py config
      - name: Deploy alerts worker to staging
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          workingDirectory: workers/observability
          command: deploy --config wrangler.staging.toml
      - name: Verify staging deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 .github/scripts/alerts_staging.py verify
