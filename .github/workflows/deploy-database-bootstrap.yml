name: First-launch database bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Check setup authorization custody
    # Set the repository variable only after the protected Environment and
    # exact release candidate have been independently approved.
    if: >-
      ${{ github.repository == 'TogetherWeOwn/nntunev2' &&
          github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
          github.run_attempt == '1' && vars.DATABASE_BOOTSTRAP_CANDIDATE_SHA == github.sha }}
    permissions: {}
    environment:
      name: staging
      deployment: false
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Reject setup authorization outside its protected Environment
        env:
          UNPROTECTED_BOOTSTRAP: >-
            ${{ secrets.BOOTSTRAP_SETUP_PASSWORD != '' || secrets.BOOTSTRAP_SHA != '' ||
                secrets.BOOTSTRAP_RUN_ID != '' || secrets.BOOTSTRAP_EXPIRY != '' ||
                secrets.BOOTSTRAP_PLAN_B64 != '' || secrets.BOOTSTRAP_PLAN_DIGEST != '' }}
        run: test "$UNPROTECTED_BOOTSTRAP" = false

  admit:
    name: Run authorized first-launch database setup
    needs: preflight
    environment: production-db-bootstrap
    concurrency:
      group: production-db-bootstrap
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Apply the privately authorized database setup plan
        timeout-minutes: 2
        env:
          PATH: /usr/bin:/bin
          BOOTSTRAP_SHA: ${{ secrets.BOOTSTRAP_SHA }}
          BOOTSTRAP_RUN_ID: ${{ secrets.BOOTSTRAP_RUN_ID }}
          BOOTSTRAP_EXPIRY: ${{ secrets.BOOTSTRAP_EXPIRY }}
          BOOTSTRAP_PLAN_B64: ${{ secrets.BOOTSTRAP_PLAN_B64 }}
          BOOTSTRAP_PLAN_DIGEST: ${{ secrets.BOOTSTRAP_PLAN_DIGEST }}
          BOOTSTRAP_SETUP_PASSWORD: ${{ secrets.BOOTSTRAP_SETUP_PASSWORD }}
          BOOTSTRAP_RUNNER_DEBUG: ${{ secrets.ACTIONS_RUNNER_DEBUG || vars.ACTIONS_RUNNER_DEBUG }}
          BOOTSTRAP_STEP_DEBUG: ${{ secrets.ACTIONS_STEP_DEBUG || vars.ACTIONS_STEP_DEBUG }}
        run: exec python3 -EsB .github/scripts/database_bootstrap_setup.py
