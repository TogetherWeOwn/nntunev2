# The required check on main is `pr-size-gate / gate`. The reusable gate
# fails closed on measurement errors. Fork PRs run with a read-only token.
# Within-limit fork PRs can pass even when the gate cannot post a comment.
# Each gate run also refreshes the advisory label before measuring the gate,
# so the last run in the PR's concurrency group can supply the tally label.
# The per-repository weekly tally calls its own read-only reusable workflow.
# See "PR size gate" in TogetherWeOwn/.github's STANDARD.md.

name: pr-size
# guards: required:pr-size-gate / gate

on:
  # Applying or withdrawing an exception must re-evaluate the gate.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # Submission and dismissal can change whether an exception applies.
  pull_request_review:
    types: [submitted, dismissed]
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Optional PR number to label and gate now (blank runs the weekly tally)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.pr_number || github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-size-gate:
    name: pr-size-gate
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review' || inputs.pr_number != ''
    permissions:
      contents: read # The reusable checks out the trusted size script.
      issues: write # Size comments and repository labels.
      pull-requests: write # PR size labels.
    uses: TogetherWeOwn/.github/.github/workflows/pr-size-gate.yml@649943c1ed8a1af8f8760e075f3923237dd72e50 # v0.14.0
    with:
      pr-number: ${{ inputs.pr_number || '' }}
      runs-on: >-
        ${{ toJSON(github.event_name == 'pull_request'
        && github.run_attempt == 1
        && github.event.pull_request.head.repo.full_name == github.repository
        && contains(fromJSON('["Rick7C2", "togetherweown[bot]"]'), github.actor)
        && contains(fromJSON('["Rick7C2", "togetherweown[bot]"]'), github.triggering_actor)
        && contains(fromJSON('["Rick7C2", "togetherweown[bot]"]'), github.event.pull_request.user.login)
        && vars.CI_BLACKSMITH_2VCPU == 'blacksmith-2vcpu-ubuntu-2404'
        && vars.CI_BLACKSMITH_2VCPU || 'ubuntu-latest') }}
      exclude-extra: ""
      advisory-label: true

  pr-size-weekly:
    name: pr-size-weekly
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.pr_number == '')
    permissions:
      contents: read # The reusable checks out the trusted size script.
      issues: read # The tally searches merged pull requests and reads their size labels.
      pull-requests: read # Weekly tally reads labels on merged PRs.
    uses: TogetherWeOwn/.github/.github/workflows/pr-size-weekly.yml@649943c1ed8a1af8f8760e075f3923237dd72e50 # v0.14.0
