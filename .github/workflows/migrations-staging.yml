name: migrations-staging

# A PR that adds or changes migrations/*.sql must declare its staging apply in
# the PR body (docs/ops.md, "Staging migrations"):
#   Staging migration: <files> — applied <YYYY-MM-DD> by <who>
#   Staging migration: pending (blocked on <ticket>)
# Recurrence guard for #815, whose migrations never reached staging and left
# staging-api red. No secrets and no DB access, so it also runs on forks.
# Proposed as a required check; keep the JOB name `migrations-staging`.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  # If made required it must report on merge_group; the queue run has no PR
  # body, so it passes vacuously (the body was checked on the PR).
  merge_group:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  # Never cancel: Dependabot fires two pull_request events ~1s apart at PR
  # creation (opened, then edited) for the same head SHA, and cancelling the
  # first leaves a permanent CANCELLED required check in the rollup next to
  # its successful twin, which reads as a stuck PR. The job takes seconds,
  # so queue the duplicate instead — `queue: max` so a third rapid event
  # cannot cancel a still-pending run either (the default queue keeps only
  # the newest pending run). Pinned by
  # .github/scripts/test_ci_required_check_concurrency.py.
  cancel-in-progress: false
  queue: max

jobs:
  migrations-staging:
    name: migrations-staging
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Merge queue vacuous pass
        if: github.event_name == 'merge_group'
        run: |
          echo "migrations-staging: merge_group vacuous pass (body checked on PR)"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
      - name: Check staging migration declaration
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          printf '%s' "${PR_BODY:-}" > "$RUNNER_TEMP/pr-body"
          # Renames count under both names, so moving a migration still needs a line.
          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" \
            --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/pr-files"
          python3 .github/scripts/migrations_staging_declaration.py \
            --body-file "$RUNNER_TEMP/pr-body" --files-file "$RUNNER_TEMP/pr-files"
