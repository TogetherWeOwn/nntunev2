name: migrations-staging

# Whether staging actually has a migration is verified against the
# database itself: the staging-api deploy gate compares the
# `schema_migrations` rows with migrations/manifest.toml (docs/ops.md,
# "Staging migrations"). This secretless per-PR check covers the one
# thing the database cannot know: pinned source lineage. Source history
# never supplies applied proof; byte-identical applied aliases remain
# separate, and differing historical rows must still fail staging.
# Required check; keep the JOB name `migrations-staging`.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  # Required checks must report on merge_group; the queue run has no PR
  # file list, so it passes vacuously (renames were checked on the PR).
  merge_group:

permissions:
  contents: read
  pull-requests: read # Read the PR file list to validate migration rename history.

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  # Never cancel: Dependabot fires two pull_request events ~1s apart at PR
  # creation (opened, then edited) for the same head SHA, and cancelling the
  # first leaves a permanent CANCELLED required check in the rollup next to
  # its successful twin, which reads as a stuck PR. The job takes seconds,
  # so queue the duplicate instead — `queue: max` so a third rapid event
  # cannot cancel a still-pending run either (the default queue keeps only
  # the newest pending run). Pinned by
  # .github/scripts/test_ci_required_check_concurrency.py.
  cancel-in-progress: false
  queue: max

jobs:
  migrations-staging:
    name: migrations-staging
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Merge queue vacuous pass
        if: github.event_name == 'merge_group'
        run: |
          echo "migrations-staging: merge_group vacuous pass (renames checked on PR)"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          # Verify actual PR ancestry, not the synthetic integration commit.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Check migration rename history
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Keep both coverage sources. Complete API pages cover net PR
          # changes; the checker independently collects every per-parent
          # Git rename, including files created then renamed within the PR.
          # Metadata pins the API response and detects the 3000-file cap.
          gh api "repos/$REPO/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr-metadata.json"
          gh api --paginate --slurp "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" \
            > "$RUNNER_TEMP/pr-files.json"
          python3 .github/scripts/migrations_rename_check.py \
            --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" \
            --files-file "$RUNNER_TEMP/pr-files.json" \
            --metadata-file "$RUNNER_TEMP/pr-metadata.json"
