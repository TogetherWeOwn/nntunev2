# guards: required:migrations-staging
name: migrations-staging

# Whether staging actually has a migration is verified against the
# database itself: the staging-api deploy gate compares the
# `schema_migrations` rows with migrations/manifest.toml (docs/ops.md,
# "Staging migrations"). This secretless per-PR check covers the one
# thing the database cannot know: pinned source lineage. Source history
# never supplies applied proof; byte-identical applied aliases remain
# separate, and differing historical rows must still fail staging.
# Required check; keep the JOB name `migrations-staging`.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # A PR against a stack branch must not get a verdict reusable on main.
    branches: [main]
  # Required checks must report on merge_group; the queue run has no PR
  # file list, so it passes vacuously (renames were checked on the PR).
  merge_group:

permissions:
  contents: read
  pull-requests: read # Read the PR file list to validate migration rename history.

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  # Never cancel: Dependabot used to fire two pull_request events ~1s apart at PR
  # creation (opened, then edited) for the same head SHA, and cancelling the
  # first leaves a permanent CANCELLED required check in the rollup next to
  # its successful twin, which reads as a stuck PR. The job takes seconds,
  # so queue the duplicate instead — `queue: max` so a third rapid event
  # cannot cancel a still-pending run either (the default queue keeps only
  # the newest pending run). Pinned by
  # .github/scripts/test_ci_required_check_concurrency.py.
  cancel-in-progress: false
  queue: max

jobs:
  migrations-staging:
    name: migrations-staging
    runs-on: >-
      ${{ github.event_name == 'pull_request'
      && github.run_attempt == 1
      && github.event.pull_request.head.repo.full_name == github.repository
      && contains(fromJSON('["Rick7C2", "togetherweown[bot]"]'), github.actor)
      && contains(fromJSON('["Rick7C2", "togetherweown[bot]"]'), github.triggering_actor)
      && contains(fromJSON('["Rick7C2", "togetherweown[bot]"]'), github.event.pull_request.user.login)
      && vars.CI_BLACKSMITH_2VCPU == 'blacksmith-2vcpu-ubuntu-2404'
      && vars.CI_BLACKSMITH_2VCPU || 'ubuntu-latest' }}
    timeout-minutes: 5
    # The data checkout has action-created Git config. Keep hooks and
    # filesystem monitors disabled when inspecting or switching its commits.
    env:
      GIT_CONFIG_NOSYSTEM: '1'
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.hooksPath
      GIT_CONFIG_VALUE_0: /dev/null
      GIT_CONFIG_KEY_1: core.fsmonitor
      GIT_CONFIG_VALUE_1: 'false'
    steps:
      - name: Merge queue vacuous pass
        if: github.event_name == 'merge_group'
        run: |
          echo "migrations-staging: merge_group vacuous pass (renames checked on PR)"
      - name: Check out pinned integration evidence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: pr-data
          fetch-depth: 0
      - name: Resolve commits with trusted first-parent code
        if: github.event_name == 'pull_request'
        id: commits
        env:
          GIT_CONFIG_GLOBAL: /dev/null
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          # Bootstrap from the runner-pinned merge's first parent. The
          # resolver validates the checkout and both parents before output.
          git --no-replace-objects -C "$GITHUB_WORKSPACE/pr-data" cat-file blob \
            "$GITHUB_SHA^1:.github/scripts/migrations_base.py" |
            python3 -I - --root "$GITHUB_WORKSPACE/pr-data" >> "$GITHUB_OUTPUT"
      - name: Check out trusted checker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          ref: ${{ steps.commits.outputs.base_sha }}
          path: trusted-checker
      - name: Select the pinned source head for evidence
        if: github.event_name == 'pull_request'
        working-directory: ${{ runner.temp }}
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          HEAD_SHA: ${{ steps.commits.outputs.head_sha }}
        # Data only. Keep the merge's full ancestry and leave the source
        # head's manifest in place for the history checker.
        run: git --no-replace-objects -C "$GITHUB_WORKSPACE/pr-data" checkout --detach "$HEAD_SHA"
      - name: Collect pinned PR API evidence
        if: github.event_name == 'pull_request'
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ steps.commits.outputs.base_sha }}
          HEAD_SHA: ${{ steps.commits.outputs.head_sha }}
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          # Each bracket retains the event identities. Git checks ancestry
          # and migration equivalence when the API trails the tested parent.
          python3 -I -c 'import sys; sys.path.insert(0, sys.argv.pop(1)); from migration_snapshot import main; sys.exit(main())' \
            "$GITHUB_WORKSPACE/trusted-checker/.github/scripts" \
            --root "$GITHUB_WORKSPACE/pr-data" \
            --integration-base --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" \
            --event-file "$GITHUB_EVENT_PATH" --output-dir "$RUNNER_TEMP"
      - name: Check migration rename history
        if: github.event_name == 'pull_request'
        working-directory: ${{ runner.temp }}
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          BASE_SHA: ${{ steps.commits.outputs.base_sha }}
          HEAD_SHA: ${{ steps.commits.outputs.head_sha }}
        run: |
          set -euo pipefail
          # -I drops cwd, PYTHONPATH and user-site imports. Add only the
          # first parent's module directory (checker + stdlib-only history).
          # Missing trusted code or evidence fails; never fall back to PR code.
          python3 -I - "$GITHUB_WORKSPACE/trusted-checker/.github/scripts" \
            --root "$GITHUB_WORKSPACE/pr-data" \
            --integration-base --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" \
            --files-file "$RUNNER_TEMP/pr-files.json" \
            --event-file "$GITHUB_EVENT_PATH" \
            --validation-output "$RUNNER_TEMP/pr-validation.json" \
            --metadata-file "$RUNNER_TEMP/pr-metadata.json" <<'PY'
          import sys
          sys.path.insert(0, sys.argv.pop(1))
          from migrations_rename_check import main
          sys.exit(main())
          PY
      - name: Retain pinned snapshot and validation evidence
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: migration-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/pr-metadata.json
            ${{ runner.temp }}/pr-files.json
            ${{ runner.temp }}/pr-validation.json
