# guards: release:staging promotion gitleaks
name: gitleaks

# Full-history secret scan; `gitleaks` is a required check on main. Uses the
# gitleaks binary directly (the gitleaks-action wrapper needs a paid licence
# for organizations), pinned by SHA-256. Keep the JOB name `gitleaks`.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Merge queue validation: `gitleaks` is a required check, so it
  # must report on merge_group. Queue runs take the merged-policy branch
  # below (event is not pull_request), which is the correct policy for the
  # temporary merge commit.
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Never cancel a queue validation run (see ci.yml).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.event_name != 'merge_group' }}

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Include text patches regardless of attributes, and merge-resolution
      # changes relative to the first parent, without limiting traversal.
      GITLEAKS_LOG_OPTS: '--text --diff-merges=first-parent HEAD'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a secret added then removed on the same branch is
          # still a leak, and a shallow clone hides it.
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          # SHA-256 of gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz, copied
          # from the release's gitleaks_${GITLEAKS_VERSION}_checksums.txt.
          # Bump together with GITLEAKS_VERSION, never on its own.
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --connect-timeout 10 --max-time 30 --retry 3 -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          chmod 0755 "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan the full history
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks
        run: |
          set -euo pipefail
          # On pull_request use the base branch's policy AND the base
          # branch's ignore file. Gitleaks reads <source>/.gitleaksignore
          # from the scanned checkout (the PR branch) IN ADDITION to
          # --gitleaks-ignore-path, so pinning the flag alone still lets a
          # PR-added ignore silence its own scan (reproduced with 8.30.1:
          # key commit + root-ignore commit exits 0 with the flag pinned
          # to an empty file). Both layers below come from the base ref:
          # the flag AND the working-tree file are forced to the base
          # policy. The history scan reads git objects, so replacing the
          # working copy hides nothing; a PR-added ignore takes effect
          # only after merge — and the merge itself required this scan to
          # pass first.
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            base="refs/remotes/origin/${GITHUB_BASE_REF}"
            scratch="$(mktemp -d "$RUNNER_TEMP/gitleaks-base-policy.XXXXXX")"
            if git cat-file -e "${base}:.gitleaks.toml" 2>/dev/null; then
              git show "${base}:.gitleaks.toml" > "${scratch}/gitleaks.toml"
            else
              printf '[extend]\nuseDefault = true\n' > "${scratch}/gitleaks.toml"
            fi
            if git cat-file -e "${base}:.gitleaksignore" 2>/dev/null; then
              git show "${base}:.gitleaksignore" > "${scratch}/.gitleaksignore"
              git show "${base}:.gitleaksignore" > .gitleaksignore
            else
              : > "${scratch}/.gitleaksignore"
              rm -f .gitleaksignore
            fi
            if git diff --name-only "${base}...HEAD" -- .gitleaksignore | grep -q .; then
              echo "::warning::PR touches .gitleaksignore; it is NOT in effect for this scan (base ignore pinned). Review the ignore change itself before merge."
            fi
            policy=(--config "${scratch}/gitleaks.toml" --gitleaks-ignore-path "${scratch}/.gitleaksignore")
          else
            policy=(--config .gitleaks.toml)
          fi
          "$GITLEAKS_BIN" git . --redact --verbose --exit-code 1 \
            --log-opts="$GITLEAKS_LOG_OPTS" --ignore-gitleaks-allow "${policy[@]}"

      # Keep fixture code in the reviewed workflow, not a script from the
      # scanned checkout. Run the required history scan first.
      - name: Self-test history scanning
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks
        run: |
          set -euo pipefail
          scratch=$(mktemp -d)
          trap 'rm -rf -- "$scratch"' EXIT

          # Use a test-only rule and a generated marker, not a real provider format.
          marker="fake-gitleaks-fixture-$(git hash-object --stdin <<< 'history scan test')"
          printf '%s\n' '[[rules]]' 'id = "fixture-marker"' \
            "regex = 'fake-gitleaks-fixture-[a-f0-9]{40}'" > "$scratch/fixture.toml"

          init_repo() {
            git init -q --initial-branch=main "$1"
            git -C "$1" config user.name 'History Scan Test'
            git -C "$1" config user.email 'fixture@example.invalid'
          }

          expect_finding() {
            local repo=$1 file=$2 status=0 commit
            commit=$(git -C "$repo" rev-parse HEAD)
            # The pinned scanner exits 1 on errors, even with partial findings.
            "$GITLEAKS_BIN" git "$repo" --redact --exit-code 17 \
              --log-opts="$GITLEAKS_LOG_OPTS" --ignore-gitleaks-allow \
              --config "$scratch/fixture.toml" --report-format json \
              --report-path "$repo.json" || status=$?
            if [ "$status" -ne 17 ] || ! jq -e --arg file "$file" --arg commit "$commit" '
              length == 1 and .[0].RuleID == "fixture-marker"
              and .[0].File == $file and .[0].Commit == $commit
            ' "$repo.json" > /dev/null; then
              printf '%s: expected one finding in %s (scanner exit: %s)\n' "${repo##*/}" "$file" "$status" >&2
              return 1
            fi
            printf '%s: expected history finding confirmed\n' "${repo##*/}"
          }

          repo="$scratch/no-diff"
          init_repo "$repo"
          printf '%s\n' 'fixture.txt -diff' > "$repo/.gitattributes"
          printf '%s\n' "$marker" > "$repo/fixture.txt"
          git -C "$repo" add .gitattributes fixture.txt
          git -C "$repo" commit -qm 'Add text fixture with a diff attribute'
          expect_finding "$repo" fixture.txt

          repo="$scratch/merge-resolution"
          init_repo "$repo"
          printf '%s\n' 'base' > "$repo/fixture.txt"
          git -C "$repo" add fixture.txt
          git -C "$repo" commit -qm 'Add common ancestor'
          git -C "$repo" switch -qc side
          printf '%s\n' 'side' > "$repo/fixture.txt"
          git -C "$repo" commit -qam 'Edit on side'
          git -C "$repo" switch -q main
          printf '%s\n' 'main' > "$repo/fixture.txt"
          git -C "$repo" commit -qam 'Edit on main'
          if git -C "$repo" merge --no-edit side || [ -z "$(git -C "$repo" ls-files -u -- fixture.txt)" ]; then
            printf '%s\n' 'merge-resolution: expected a conflict in fixture.txt' >&2
            exit 1
          fi
          printf '%s\n' "$marker" > "$repo/fixture.txt"
          git -C "$repo" add fixture.txt
          git -C "$repo" commit -qm 'Resolve conflict with the test marker'
          expect_finding "$repo" fixture.txt
