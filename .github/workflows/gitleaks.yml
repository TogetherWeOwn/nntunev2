name: gitleaks

# Full-history secret scan; `gitleaks` is a required check on main. Uses the
# gitleaks binary directly (the gitleaks-action wrapper needs a paid licence
# for organizations), pinned by SHA-256. Keep the JOB name `gitleaks`.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a secret added then removed on the same branch is
          # still a leak, and a shallow clone hides it.
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          # SHA-256 of gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz, copied
          # from the release's gitleaks_${GITLEAKS_VERSION}_checksums.txt.
          # Bump together with GITLEAKS_VERSION, never on its own.
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          chmod 0755 "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan the full history
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks
        run: |
          set -euo pipefail
          # On pull_request use the base branch's policy so a PR cannot silence
          # its own scan; on push scan with the merged policy.
          if [ "${{ github.event_name }}" = pull_request ]; then
            base="refs/remotes/origin/${{ github.base_ref }}"
            scratch="$(mktemp -d "$RUNNER_TEMP/gitleaks-base-policy.XXXXXX")"
            if git cat-file -e "${base}:.gitleaks.toml" 2>/dev/null; then
              git show "${base}:.gitleaks.toml" > "${scratch}/gitleaks.toml"
            else
              printf '[extend]\nuseDefault = true\n' > "${scratch}/gitleaks.toml"
            fi
            "$GITLEAKS_BIN" git . --redact --verbose --exit-code 1 \
              --log-opts=HEAD --ignore-gitleaks-allow \
              --config "${scratch}/gitleaks.toml"
          else
            "$GITLEAKS_BIN" git . --redact --verbose --exit-code 1 \
              --log-opts=HEAD --ignore-gitleaks-allow \
              --config .gitleaks.toml
          fi
