name: codeql

# CodeQL scans JavaScript/TypeScript and GitHub Actions; CodeQL has no Rust support.
# Rust coverage comes from cargo audit/clippy jobs the scaffold card adds.
# Feeds the `CodeQL` code_scanning rule on main.

# No path filters: the `baseline-codeql` ruleset requires CodeQL results on
# every PR once main has analyses, so a filtered-out PR (Rust or docs only)
# waits forever for results that never arrive. Every PR and every main push
# is scanned so the rule always has a result to compare.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Merge queue validation: report on merge_group so the code_scanning rule
  # never stalls the queue.
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Never cancel a queue validation run (see ci.yml).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.event_name != 'merge_group' }}

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read # CodeQL reads workflow-run metadata when uploading results.
      contents: read
      security-events: write # Publish CodeQL SARIF to code scanning.
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
