# guards: required:CodeQL
name: codeql

# CodeQL scans JavaScript/TypeScript and GitHub Actions; CodeQL has no Rust support.
# Rust coverage comes from cargo audit/clippy jobs the scaffold card adds.
# Feeds the `CodeQL` code_scanning rule on main.

# No path filters: the `baseline-codeql` ruleset requires CodeQL results on
# every PR once main has analyses, so a filtered-out PR (Rust or docs only)
# waits forever for results that never arrive. Schedule or dispatch a scan
# to refresh default-branch results.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Merge queue validation: report on merge_group so the code_scanning rule
  # never stalls the queue.
  merge_group:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read # CodeQL reads workflow-run metadata when uploading results.
      contents: read
      security-events: write # Publish CodeQL SARIF to code scanning.
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}

      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: "/language:${{ matrix.language }}"
