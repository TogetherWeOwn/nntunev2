name: worker-lock-proposal

# Temporary report-only proposal; the existing locked CI gates remain required.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  worker-lock-proposal:
    name: worker-lock-proposal
    if: github.event.pull_request.number == 1191 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --no-self-update
      - name: Check proposal guards
        run: python3 -I .github/scripts/test_worker_lock_proposal.py
      - name: Propose Worker locks and pins
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 -I .github/scripts/worker_lock_proposal.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-lock-proposal-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/worker-lock-proposal/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
