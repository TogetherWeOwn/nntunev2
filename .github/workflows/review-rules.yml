name: review-rules (shadow)
# ci-policy: non-required -- advisory signals; existing required gates stay unchanged.
# Repin to TogetherWeOwn/.github's squash-merge SHA after central PR #26 merges.
on:
  pull_request:
  merge_group:
permissions: {}
concurrency:
  group: review-rules-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  review-rules:
    permissions:
      contents: read
    uses: TogetherWeOwn/.github/.github/workflows/review-rules.yml@cf983076f568407ce2dceb6eeabd1beb2e1e28c6 # v0.4.0
    with:
      packs: rust,ts,security
      mode: warn
