# guards: paths
name: review-rules (shadow)
# ci-policy: non-required -- advisory signals; existing required gates stay unchanged.
# Repin to TogetherWeOwn/.github's squash-merge SHA after central PR #26 merges.
on:
  pull_request:
    paths:
      - '**.rs'
      - '**.py'
      - '**.ts'
      - '**.tsx'
      - '**.js'
      - '**.jsx'
      - '**.mjs'
      - '**.cjs'
      - '**.svelte'
      - '**.sh'
      - '**.bash'
      - '**.toml'
      - '**.sql'
      - '**.yml'
      - '**.yaml'
  merge_group:
permissions: {}
concurrency:
  group: review-rules-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  review-rules:
    permissions:
      contents: read
    uses: TogetherWeOwn/.github/.github/workflows/review-rules.yml@bfdaf1532e1605281d366186e4ed9e8cfa0113fc # v0.13.0
    with:
      packs: rust,ts,security
      mode: warn
