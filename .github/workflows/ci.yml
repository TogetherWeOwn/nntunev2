name: ci

# Real jobs live as siblings below; add each new job id to `ci-ok`'s `needs`.
# `ci-ok` is a required check on main: its NAME must stay `ci-ok`.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Rust workspace: fmt, clippy (warnings are errors) and every test,
  # including the synthetic-NNTP integration suite and its TTFB budget.
  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  placeholder:
    name: placeholder
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "scaffold card: replace me with real jobs"

  api:
    name: api
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo test --manifest-path workers/api/Cargo.toml --all-targets
      - run: cargo clippy --manifest-path workers/api/Cargo.toml --all-targets -- -D warnings
      - run: cargo fmt --manifest-path workers/api/Cargo.toml -- --check
      # The Worker deploys to wasm32: the crate must check on that target
      # (native-only CI once missed a getrandom/RNG breakage there).
      - run: cargo check --manifest-path workers/api/Cargo.toml --target wasm32-unknown-unknown

  # Aggregate required check: every dependency must succeed, including
  # when a required job fails, is cancelled, or is skipped.
  ci-ok:
    name: ci-ok
    needs: [placeholder, api, rust]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          if ! printf '%s' "$NEEDS_JSON" | jq -e 'length > 0 and all(.[]; .result == "success")' >/dev/null; then
            echo "ci-ok: a required job did not succeed"
            exit 1
          fi
          echo "ci-ok: all required jobs passed"
