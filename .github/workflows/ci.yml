name: ci

# Placeholder CI. The scaffold card replaces the placeholder jobs below with
# real build/test/lint jobs and adds each new job id to `ci-ok`'s `needs`.
# `ci-ok` is a required check on main: its NAME must stay `ci-ok`.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Placeholder: real jobs (build, test, lint, …) go here as siblings.
  # Example for the scaffold card:
  #   build:
  #     name: build
  #     runs-on: ubuntu-latest
  #     steps: [...]
  # then add `build` to ci-ok's `needs` list.
  placeholder:
    name: placeholder
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "scaffold card: replace me with real jobs"

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # No npm cache: the repo gitignores lockfiles, so there is no
      # lockfile to hash for cache restore. Revisit when lockfiles land.
      - run: npm install --no-audit --no-fund --include=dev
      - run: npm test -- --run
      - run: npm run check

  api:
    name: api
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo test --manifest-path workers/api/Cargo.toml --all-targets
      - run: cargo clippy --manifest-path workers/api/Cargo.toml --all-targets -- -D warnings
      - run: cargo fmt --manifest-path workers/api/Cargo.toml -- --check
      # The Worker deploys to wasm32: the crate must check on that target
      # (native-only CI once missed a getrandom/RNG breakage there).
      - run: cargo check --manifest-path workers/api/Cargo.toml --target wasm32-unknown-unknown

  # Aggregate required check: every dependency must succeed, including
  # when a required job fails, is cancelled, or is skipped.
  ci-ok:
    name: ci-ok
    needs: [placeholder, api, web]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          if ! printf '%s' "$NEEDS_JSON" | jq -e 'length > 0 and all(.[]; .result == "success")' >/dev/null; then
            echo "ci-ok: a required job did not succeed"
            exit 1
          fi
          echo "ci-ok: all required jobs passed"
