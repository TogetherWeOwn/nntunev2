name: ci

# Placeholder CI plus the workers/mb Rust job. Add each new job id to
# `ci-ok`'s `needs` so the required check stays red when any job fails.
# `ci-ok` is a required check on main: its NAME must stay `ci-ok`.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Placeholder: real jobs (build, test, lint, …) go here as siblings.
  placeholder:
    name: placeholder
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "scaffold card: replace me with real jobs"

  rust-mb:
    name: rust (workers/mb)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - name: fmt
        run: cargo fmt --check --manifest-path workers/mb/Cargo.toml
      - name: clippy (wasm32, deny warnings)
        run: cargo clippy --manifest-path workers/mb/Cargo.toml --target wasm32-unknown-unknown -- -D warnings
      - name: test
        run: cargo test --manifest-path workers/mb/Cargo.toml

  # Aggregate required check. Add every real job id to `needs` (and keep
  # `!cancelled()` + `contains(needs.*.result, 'failure')` logic) so ci-ok
  # stays red when any job fails and green only when all succeed.
  ci-ok:
    name: ci-ok
    needs: [placeholder, rust-mb]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          if printf '%s' '${{ toJSON(needs) }}' | grep -q '"result":"failure"'; then
            echo "ci-ok: a required job failed"
            exit 1
          fi
          echo "ci-ok: all required jobs passed"
