name: ci

# Placeholder CI. The scaffold card replaces the placeholder jobs below with
# real build/test/lint jobs and adds each new job id to `ci-ok`'s `needs`.
# `ci-ok` is a required check on main: its NAME must stay `ci-ok`.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Placeholder: real jobs (build, test, lint, …) go here as siblings.
  # Example for the scaffold card:
  #   build:
  #     name: build
  #     runs-on: ubuntu-latest
  #     steps: [...]
  # then add `build` to ci-ok's `needs` list.
  placeholder:
    name: placeholder
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "scaffold card: replace me with real jobs"

  # Public-repo hygiene: fail on internal tracker ids (TOG-<digits>),
  # internal hostnames, instance-UI paths and agent names in tracked text.
  # CONTRIBUTING.md states the rule; this job enforces it (F-HYG-02).
  public-text:
    name: public-text
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Lint public text for internal identifiers
        run: python3 .github/scripts/public_text_lint.py
      - name: Unit-test the lint
        run: python3 .github/scripts/test_public_text_lint.py

  # Aggregate required check. Add every real job id to `needs` (and keep
  # `!cancelled()` + the RESULTS check below) so ci-ok stays red when any
  # job fails and green only when all succeed. The check reads
  # join(needs.*.result, ' ') — never grep pretty-printed JSON for a
  # result string (whitespace-sensitive, silently never matches).
  ci-ok:
    name: ci-ok
    needs: [placeholder, public-text]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          case " $RESULTS " in
            *" failure "*|*" cancelled "*)
              echo "ci-ok: a required job failed (results: $RESULTS)"
              exit 1
              ;;
          esac
          echo "ci-ok: all required jobs passed (results: $RESULTS)"
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
