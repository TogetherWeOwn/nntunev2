name: ci

# Real jobs live as siblings below; add each new job id to `ci-ok`'s `needs`.
# `ci-ok` is a required check on main: its NAME must stay `ci-ok`.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Rust workspace: fmt, clippy (warnings are errors) and every test,
  # including the synthetic-NNTP integration suite and its TTFB budget.
  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  placeholder:
    name: placeholder
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "scaffold card: replace me with real jobs"

  # Aggregate required check. Add every real job id to `needs` (and keep
  # `!cancelled()` + `contains(needs.*.result, 'failure')` logic) so ci-ok
  # stays red when any job fails and green only when all succeed.
  ci-ok:
    name: ci-ok
    needs: [placeholder, rust]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RESULTS: ${{ join(needs.*.result, ' ') }}
    steps:
      - run: |
          # `needs.*.result` is failure / cancelled / skipped / success.
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "ci-ok: a required job did not succeed ($RESULTS)"
              exit 1
            fi
          done
          echo "ci-ok: all required jobs passed ($RESULTS)"
