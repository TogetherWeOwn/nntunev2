# Phase 0 spike: R2 snapshot backend for workers/mb (measurement only).
#
# Never runs on push and is not a required check. Two entry points:
# - `workflow_dispatch`: the full measurement. With `stage: true` and only
#   on `main`, it also uploads the snapshot to the staging bucket, deploys
#   the token-gated spike Worker, runs the latency bench and tears both
#   down (workers/mb/spike/stage.sh). That is the only step that sees the
#   Cloudflare CI token.
# - a PR labeled `mb-snapshot-spike`: build + recall only, no secrets.
#
# Gates and method: workers/mb/SNAPSHOT.md. Only the CC0 core archive
# (mbdump.tar.bz2) is downloaded; no NC-licensed archive, no replication
# packet, no live MusicBrainz API call.
name: mb-snapshot-spike

on:
  workflow_dispatch:
    inputs:
      dump:
        description: "fullexport directory (YYYYMMDD-HHMMSS); blank = LATEST"
        required: false
        type: string
      stage:
        description: "Upload, deploy the spike Worker and bench (main only)"
        required: false
        type: boolean
        default: false
      golden_count:
        description: "Golden-set size"
        required: false
        type: string
        default: "1000"
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: mb-snapshot-spike
  cancel-in-progress: false

env:
  WRANGLER_VERSION: 4.153.0
  RUST_IMAGE: rust:1-bookworm@sha256:48b7f435b8fc6378ce43b44f15e3a47fd8919b2825f835c39bd4bd3da50af5b8
  PG_IMAGE: postgres:18-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8

jobs:
  spike:
    name: mb-snapshot-spike
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'mb-snapshot-spike'
    runs-on: ubuntu-latest
    timeout-minutes: 345
    # Staging-scoped by name only (no rules, no deployment record). The
    # Cloudflare secrets are still read only by the main-only stage steps.
    environment:
      name: staging
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve dump
        id: dump
        env:
          INPUT_DUMP: ${{ inputs.dump }}
        run: |
          set -euo pipefail
          dump="${INPUT_DUMP:-}"
          if [ -z "$dump" ]; then
            dump=$(curl -fsS https://data.metabrainz.org/pub/musicbrainz/data/fullexport/LATEST | tr -d '[:space:]')
          fi
          [[ "$dump" =~ ^[0-9]{8}-[0-9]{6}$ ]] || { echo "bad dump id"; exit 1; }
          echo "dump=$dump" >> "$GITHUB_OUTPUT"

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / /mnt

      - name: Build snapshot tools (bookworm glibc)
        run: |
          set -euo pipefail
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src/workers/mb "$RUST_IMAGE" \
            cargo build --release --locked --example snapshot_build --example snapshot_eval
          mkdir -p "$RUNNER_TEMP/tools"
          sudo cp workers/mb/target/release/examples/snapshot_build workers/mb/target/release/examples/snapshot_eval "$RUNNER_TEMP/tools/"
          sudo rm -rf workers/mb/target

      - name: Build job image
        run: docker build -f containers/mb-import/Dockerfile --target base -t mb-spike:ci .

      - name: Measured build (standard-4 envelope, gate 3)
        env:
          MB_DUMP: ${{ steps.dump.outputs.dump }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          bash workers/mb/spike/measure.sh mb-spike:ci "$RUNNER_TEMP/tools" /mnt/spike.img /work "$RUNNER_TEMP/out/build.json"
          tail -50 "$RUNNER_TEMP/out/build.log"
          cp /work/dump/dump-meta.json /work/snap/build-*.json "$RUNNER_TEMP/out/" 2>/dev/null || true
          du -sb /work/snap > "$RUNNER_TEMP/out/snapshot-size.txt" || true
          (cd /work/snap && sha256sum *.idx *.dat.* > "$RUNNER_TEMP/out/snapshot-sha256.txt") || true
          jq -e '.exit_code == 0' "$RUNNER_TEMP/out/build.json"

      - name: Lookup samples and golden set
        env:
          GOLDEN_COUNT: ${{ inputs.golden_count || '1000' }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/out"; mkdir -p "$out/mbids"
          cur=/work/dump/curated
          for kind in artist release recording; do
            gzip -dc "$cur/mbdump-$kind.tsv.gz" | cut -f1 | shuf -n 1000 --random-source=<(yes 3599) > "$out/mbids/$kind.txt"
            "$RUNNER_TEMP/tools/snapshot_eval" lookup /work/snap "$kind" < "$out/mbids/$kind.txt"
          done
          python3 workers/mb/spike/golden.py "$cur" "$out/golden.tsv" "$GOLDEN_COUNT"

      - name: Recall vs pg_trgm (gate 1)
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/out"
          mkdir -p "$RUNNER_TEMP/pgdata"
          docker run -d --name mbpg -e POSTGRES_HOST_AUTH_METHOD=trust \
            -v "$RUNNER_TEMP/pgdata:/var/lib/postgresql" "$PG_IMAGE"
          for _ in $(seq 1 60); do docker exec mbpg pg_isready -U postgres && break; sleep 2; done
          python3 workers/mb/spike/pg_baseline.py load /work/dump/curated
          python3 workers/mb/spike/pg_baseline.py search "$out/golden.tsv" "$out/hits-pg.tsv"
          "$RUNNER_TEMP/tools/snapshot_eval" search /work/snap < "$out/golden.tsv" > "$out/hits-snapshot.tsv"
          python3 workers/mb/spike/recall.py "$out/golden.tsv" "$out/hits-pg.tsv" "$out/hits-snapshot.tsv" "$out/recall.json" | tee "$out/recall.md"
          docker rm -f mbpg

      - name: Stage, deploy spike Worker and bench (gate 2)
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.stage
        env:
          MB_DUMP: ${{ steps.dump.outputs.dump }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --no-self-update --target wasm32-unknown-unknown
          rustup default stable
          bash workers/mb/spike/stage.sh up /work/snap
          bash workers/mb/spike/stage.sh bench "$RUNNER_TEMP/out/mbids" "$RUNNER_TEMP/out/golden.tsv" "$RUNNER_TEMP/out/bench.json"

      - name: Tear down spike Worker and objects
        if: always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.stage
        env:
          MB_DUMP: ${{ steps.dump.outputs.dump }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash workers/mb/spike/stage.sh down

      - name: Summary
        if: always()
        env:
          MB_DUMP: ${{ steps.dump.outputs.dump }}
        run: |
          out="$RUNNER_TEMP/out"
          {
            echo "## mb-snapshot-spike (${MB_DUMP})"
            for f in build.json snapshot-size.txt recall.md bench.json; do
              if [ -f "$out/$f" ]; then echo "### $f"; echo '```'; cat "$out/$f"; echo '```'; fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mb-snapshot-spike-results
          path: ${{ runner.temp }}/out
          if-no-files-found: warn
