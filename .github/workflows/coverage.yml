name: Rust coverage summary

on:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# Report-only summary: a newer run supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: Rust line coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --component llvm-tools-preview
          rustup default stable
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          # Cargo's current build layout puts test executables under debug/build.
          tool: cargo-llvm-cov@0.9.1

      - name: Collect Rust line coverage
        shell: bash
        run: |
          set -euo pipefail
          # Keep the previous instrumentation of local path dependencies and
          # count unit-test modules under src while excluding test target dirs.
          coverage_options=(--no-rustc-wrapper --no-default-ignore-filename-regex --lcov)
          toolchain_sources='/rustc/([0-9a-f]+|[0-9]+\.[0-9]+\.[0-9]+)/|/\.cargo/(registry|git)/|/\.rustup/toolchains/'
          coverage_exclusions() {
            local workspace="$1"
            printf '%s' "${toolchain_sources}|^${workspace}(/.*)?/(tests|examples|benches)/|^${workspace}/target/llvm-cov-target(/|$)"
          }

          cargo llvm-cov --workspace "${coverage_options[@]}" \
            --ignore-filename-regex "$(coverage_exclusions "$GITHUB_WORKSPACE")" \
            --output-path coverage-root.lcov
          # `--locked` for api, ingest, mb, repair and transcode: each
          # committed workers/<crate>/Cargo.lock is the audited
          # dependency set, enforced the same way as in the required
          # CI lanes.
          for crate in api repair transcode ingest mb; do
            cargo llvm-cov --locked --manifest-path "workers/${crate}/Cargo.toml" \
              "${coverage_options[@]}" \
              --ignore-filename-regex "$(coverage_exclusions "$GITHUB_WORKSPACE/workers/${crate}")" \
              --output-path "coverage-${crate}.lcov"
          done

      - name: Write line coverage summary
        shell: bash
        run: |
          set -euo pipefail
          printf '| Crate | Lines found | Lines hit | Line coverage |\n' >> "$GITHUB_STEP_SUMMARY"
          printf '| --- | ---: | ---: | ---: |\n' >> "$GITHUB_STEP_SUMMARY"
          for crate in root api ingest mb repair transcode; do
            report="coverage-${crate}.lcov"
            if [[ ! -s "$report" ]]; then
              echo "Coverage report for ${crate} is missing or empty: ${report}" >&2
              exit 1
            fi
            read -r found hit < <(awk -F: '
              /^LF:/ { found += $2 }
              /^LH:/ { hit += $2 }
              END { printf "%d %d\n", found, hit }
            ' "$report")
            if (( found <= 0 )); then
              echo "Coverage report for ${crate} contains no instrumented lines: ${report}" >&2
              exit 1
            fi
            if (( hit < 0 || hit > found )); then
              echo "Coverage report for ${crate} has invalid hit count ${hit} for ${found} lines: ${report}" >&2
              exit 1
            fi
            percent=$(awk -v hit="$hit" -v found="$found" 'BEGIN { printf "%.1f%%", 100 * hit / found }')
            printf '| `%s` | %s | %s | %s |\n' "$crate" "$found" "$hit" "$percent" >> "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-coverage-lcov
          path: coverage-*.lcov
          if-no-files-found: error
          retention-days: 14
