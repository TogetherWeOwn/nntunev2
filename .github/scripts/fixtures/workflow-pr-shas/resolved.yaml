name: sample
on: pull_request
jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }} # retained
      - name: Read pinned base
        env:
          SHA: ${{ needs.ci-commits.outputs.base_sha }}
          # Example: ${{ github.event.pull_request.head.sha }}
        run: test -n "$SHA"
