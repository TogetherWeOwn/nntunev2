# Dependabot version-updates config.
#
# Alerts are not updates: Dependabot alerts only notify, they never open a
# fix on their own. This file makes Dependabot open version-update PRs so
# vulnerable Actions pins and dependencies actually get fixed.
#
# Pinned-checkout-SHA discipline stays: keep `uses: <action>@<full SHA>`
# with a `# vX.Y.Z` version comment. Dependabot updates the SHA and the
# comment together -- never replace a SHA pin with a bare tag.
#
# Directories are forward-looking: entries stay dormant until their
# manifests land (`Cargo.toml` at the workspace root, `package.json`
# under `web/` for the SvelteKit frontend).

version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
