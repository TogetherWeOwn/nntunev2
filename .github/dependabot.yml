# Dependabot version-updates config.
#
# Alerts are not updates: Dependabot alerts only notify, they never open a
# fix on their own. This file makes Dependabot open version-update PRs so
# vulnerable Actions pins and dependencies actually get fixed.
#
# Pinned-checkout-SHA discipline stays: keep `uses: <action>@<full SHA>`
# with a `# vX.Y.Z` version comment. Dependabot updates the SHA and the
# comment together -- never replace a SHA pin with a bare tag.
#
# Directories are forward-looking: entries stay dormant until their
# manifests land (`Cargo.toml` at the workspace root, `package.json`
# under `web/` for the SvelteKit frontend).
#
# When those manifests land, commit their lockfiles too (remove the
# corresponding ignore lines first): without a committed lockfile the
# dependency graph cannot see transitive versions, so the cargo/npm
# entries above cannot do their job.
#
# First Dependabot PR: confirm the required checks (`ci-ok`, `gitleaks`,
# `pr-lint`, Paperclip Review) all appear on it before relying on them —
# automated authorship may not trigger every check. If the review check
# is missing, a maintainer mentions the reviewer on the PR.

version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
