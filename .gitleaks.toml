[allowlist]
description = "Bot-contract corpus fixtures (e2e/fixtures/bot-contract/): v1 HMAC tokens minted under the published synthetic corpus secret. Pinned offline test vectors; the MACs authenticate nothing and the secret is public by design. Shape-scoped only (gitleaks allowlist fields are ORed, so paths/rules would over-suppress): the regex matches the v1 envelope with a substantial payload and signature, and anything else still trips. Verified: non-v1 and other-rule probes in the corpus files trip (see the PR)."
regexes = ['v1\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{20,}']
