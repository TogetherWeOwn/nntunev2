[extend]
useDefault = true

[allowlist]
description = "Pinned HMAC test-vector corpora: bot-contract fixtures (e2e/fixtures/bot-contract/, v1 tokens) and play-grant cross-crate vectors (fixtures/play-grant/, v2 tokens), each minted under synthetic secrets published alongside the vectors. The MACs authenticate nothing and the secrets are public by design. Conjunctive (condition AND): one of the vector paths plus a v1/v2 envelope with a substantial payload and signature; anything else still trips. Residual: a real grant pasted inside either vector directory would still be suppressed; those directories must never hold real secrets."
condition = "AND"
paths = ['e2e/fixtures/bot-contract/.*', 'fixtures/play-grant/.*']
regexes = ['^v1\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{20,}$', '^v2\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{20,}$']
