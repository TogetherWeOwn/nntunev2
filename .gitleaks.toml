[extend]
useDefault = true

[allowlist]
description = "Bot-contract corpus fixtures (e2e/fixtures/bot-contract/): v1 HMAC tokens minted under the published synthetic corpus secret. Pinned offline test vectors; the MACs authenticate nothing and the secret is public by design. Conjunctive (condition AND): fixtures path plus the v1 envelope with a substantial payload and signature; anything else still trips. Residual: a real grant pasted inside the fixtures directory would still be suppressed; that directory must never hold real secrets."
condition = "AND"
paths = ['e2e/fixtures/bot-contract/.*']
regexes = ['^v1\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{20,}$']
