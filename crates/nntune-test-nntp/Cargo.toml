[package]
name = "nntune-test-nntp"
version = "0.1.0"
edition = "2021"
description = "NNTune v2 shim over velmora-test-nntp (synthetic NNTP test server + fixture corpus; no real Usenet in CI)"
license = "MIT"
repository = "https://github.com/TogetherWeOwn/nntunev2"

[lib]
name = "nntune_test_nntp"
path = "src/lib.rs"

[dependencies]
# Same immutable pin as velmora in crates/nntune-core/Cargo.toml.
velmora-test-nntp = { version = "0.1.0", git = "https://github.com/TogetherWeOwn/velmora", rev = "40dba9a8cedb27748fa22e8a1d63cb2132067efd" }

[dev-dependencies]
# Consumer-boundary acceptance (tests/pinned_engine_boundary.rs): the
# nntune-core client against this server, both at the pinned velmora rev.
# nntune-core never depends on this crate, so there is no cycle.
nntune-core = { version = "0.1.0", path = "../nntune-core" }
tokio = { version = "1", features = ["full"] }
