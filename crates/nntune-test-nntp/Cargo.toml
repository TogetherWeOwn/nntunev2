[package]
name = "nntune-test-nntp"
version = "0.1.0"
edition = "2021"
description = "Synthetic NNTP test server + fixture corpus for NNTune v2 CI (no real Usenet in CI)"
license = "MIT"
repository = "https://github.com/TogetherWeOwn/nntunev2"

[lib]
name = "nntune_test_nntp"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
nntune-core = { version = "0.1.0", path = "../nntune-core", default-features = false, features = ["native-tls"] }
