[package]
name = "nntune-backup"
version = "0.1.0"
edition = "2021"
description = "Offsite backup bundle format + restore-drill tooling for the encrypted library (native-only, never a Worker dependency)"
license = "MIT"
rust-version = "1.75"

[lib]
name = "nntune_backup"
path = "src/lib.rs"

[[bin]]
name = "backup-drill"
path = "src/main.rs"

[dependencies]
nntune-core = { version = "0.1.0", path = "../nntune-core" }
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
base64 = "0.23"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", features = ["derive"] }
getrandom = "0.4"

[dev-dependencies]
serde_json = "1"
