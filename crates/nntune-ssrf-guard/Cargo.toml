[package]
name = "nntune-ssrf-guard"
version = "0.1.0"
edition = "2021"
description = "NNTune v2 shim over the shared velmora SSRF address guard and test vectors (native + wasm32, std-only)"
license = "MIT"
repository = "https://github.com/TogetherWeOwn/nntunev2"

[dependencies]
# Same immutable pin as the engine and test-support shims.
velmora-ssrf-guard = { version = "0.1.0", git = "https://github.com/TogetherWeOwn/velmora", rev = "5af1bfe901d15b5f041a5d1973b866436d988b19" }

[lib]
name = "nntune_ssrf_guard"
path = "src/lib.rs"
