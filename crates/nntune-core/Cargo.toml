[package]
name = "nntune-core"
version = "0.1.0"
edition = "2021"
description = "NNTune v2 shim over the velmora Usenet engine, plus the NNTune-only transcode, original-source and provider-authority-store modules"
license = "MIT"
# velmora's locked dependency graph needs 1.89 (aes 0.9).
rust-version = "1.89"

[features]
default = ["native-tls"]
native-tls = ["velmora/native-tls"]
worker-transport = ["velmora/worker-transport"]

[dependencies]
# The engine (NNTP, yEnc, NZB, decrypt, par2, transports) lives in
# TogetherWeOwn/velmora. Pin policy: an immutable git `rev` only (never a
# branch or tag); a bump is a reviewed PR that moves this rev, the matching
# nntune-test-nntp rev and every committed lockfile together.
velmora = { version = "0.1.0", git = "https://github.com/TogetherWeOwn/velmora", rev = "c5e79d617896490a47d577a9b062cd0010e0bc8a", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crc32fast = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[lib]
name = "nntune_core"
path = "src/lib.rs"
