[package]
name = "nntune-core"
version = "0.1.0"
edition = "2021"
description = "NNTune v2 shim over the velmora Usenet engine, plus the NNTune-only modules"
license = "MIT"
# velmora's MSRV (its locked dependency graph needs 1.89).
rust-version = "1.89"

[features]
default = ["native-tls"]
native-tls = ["velmora/native-tls"]
worker-transport = ["velmora/worker-transport"]
# Metadata/fixture development only; no installed archive writer or miss path.
archive-provider = ["velmora/archive-provider"]

[dependencies]
# The engine (NNTP, yEnc, NZB, media encryption, par2, transports) lives in
# TogetherWeOwn/velmora. Pin policy: an immutable git `rev` only (never a
# branch or tag); a bump is a reviewed PR that moves this rev, the matching
# nntune-test-nntp rev and every committed lockfile together.
velmora = { version = "0.1.0", git = "https://github.com/TogetherWeOwn/velmora", rev = "e8fb2adeda386a38d74fc77c7aaa0a05a1b70bf3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crc32fast = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[lib]
name = "nntune_core"
path = "src/lib.rs"
